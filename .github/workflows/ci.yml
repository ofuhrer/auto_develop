name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
      - copilot/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall src
      - name: Pytest
        run: python -m pytest
      - name: CLI smoke tests
        run: |
          PYTHONPATH=src python -m agentic_devloop --help
          PYTHONPATH=src python -m agentic_devloop run-release --help
