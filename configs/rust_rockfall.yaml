project_id: rust_rockfall
repo_path: /path/to/rust_rockfall
default_base_branch: main
worktree_root: /path/to/worktrees/rust_rockfall

executor:
  type: codex_cli
  model: gpt-5.3-codex-spark
  max_walltime_minutes: 25

model_roles:
  worker:
    type: codex_cli
    model: gpt-5.3-codex-spark
    fallback_models:
      - gpt-5.4-mini
    max_walltime_minutes: 25
  reviewer:
    type: codex_cli
    model: gpt-5.5
    max_walltime_minutes: 20
  planner:
    type: codex_cli
    model: gpt-5.5
    max_walltime_minutes: 20

model_routing:
  default_role: worker
  task_type_roles:
    scientific_validation: reviewer
    release_preparation: reviewer
  budget_class_roles:
    L: reviewer
    XL: planner
  escalation_role: reviewer

verification_profiles:
  default:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features
  code_only:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features
  documentation:
    commands:
      - cargo test --all-targets --all-features
  benchmark:
    commands:
      - cargo fmt --check
      - cargo test --all-targets --all-features
  scientific_validation:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features
      - python scripts/validate_public_real_site_conditional_pilot_run.py --check
  release_preparation:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features

budget:
  max_executor_attempts_per_task: 2
  max_strong_model_calls_per_release: 10
  max_changed_files_per_task: 8
  max_diff_lines_per_task: 600
