project_id: rust_rockfall
repo_path: /Users/fuhrer/Desktop/rust_rockfall/main
default_base_branch: main
worktree_root: /Users/fuhrer/Desktop/rust_rockfall/worktrees
repo_state_path: repo_state/rust_rockfall

executor:
  type: codex_cli
  model: gpt-5.3-codex
  max_walltime_minutes: 25
  fallback_models:
    - gpt-5.4-mini

model_catalog:
  strategic_planner:
    model: gpt-5.5
    capabilities:
      - strategic_planning
      - hard_debugging
      - scientific_reasoning
    budget_class: XL
    availability: supported
  runtime_supervisor:
    model: gpt-5.2
    capabilities:
      - runtime_supervision
      - review
      - long_running_stability
    budget_class: L
    availability: unknown
  coding_worker:
    model: gpt-5.3-codex
    capabilities:
      - implementation
      - refactoring
      - tests
    budget_class: M
    availability: unknown
  micro_repair:
    model: gpt-5.3-codex-spark
    capabilities:
      - conflict_repair
      - lint_repair
      - tiny_patches
    budget_class: XS
    availability: unknown
  cheap_router:
    model: gpt-5.4-mini
    capabilities:
      - routing
      - summarization
      - fallback_worker
    budget_class: S
    availability: supported

model_roles:
  worker:
    type: codex_cli
    model: gpt-5.3-codex
    max_walltime_minutes: 25
    fallback_models:
      - gpt-5.4-mini
  repair:
    type: codex_cli
    model: gpt-5.3-codex-spark
    max_walltime_minutes: 10
    fallback_models:
      - gpt-5.4-mini
  router:
    type: codex_cli
    model: gpt-5.4-mini
    max_walltime_minutes: 10
  reviewer:
    type: codex_cli
    model: gpt-5.2
    max_walltime_minutes: 20
    fallback_models:
      - gpt-5.5
  planner:
    type: codex_cli
    model: gpt-5.5
    max_walltime_minutes: 20

model_routing:
  default_role: worker
  task_type_roles:
    documentation: router
    scientific_validation: reviewer
    release_preparation: reviewer
  budget_class_roles:
    L: reviewer
    XL: planner
  escalation_role: reviewer

verification_profiles:
  default:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features
  code_only:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features
  documentation:
    commands:
      - cargo test --all-targets --all-features
  benchmark:
    commands:
      - cargo fmt --check
      - cargo test --all-targets --all-features
  scientific_validation:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features
      - python scripts/validate_public_real_site_conditional_pilot_run.py --check
  release_preparation:
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-targets --all-features

budget:
  max_executor_attempts_per_task: 2
  max_strong_model_calls_per_release: 10
  max_changed_files_per_task: 8
  max_diff_lines_per_task: 600
