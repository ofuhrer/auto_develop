project_id: auto_develop
repo_path: /Users/fuhrer/Desktop/auto_develop/main
default_base_branch: main
worktree_root: /Users/fuhrer/Desktop/auto_develop/worktrees
repo_state_path: repo_state/auto_develop

executor:
  type: codex_cli
  model: gpt-5.3-codex-spark
  max_walltime_minutes: 25
  fallback_models:
    - gpt-5.3-codex
    - gpt-5.4-mini

model_catalog:
  strategic_planner:
    model: gpt-5.5
    capabilities:
      - strategic_planning
      - hard_debugging
      - semantic_review
    budget_class: XL
    availability: supported
  runtime_supervisor:
    model: gpt-5.2
    capabilities:
      - runtime_supervision
      - review
      - long_running_stability
    budget_class: L
    availability: supported
  coding_worker:
    model: gpt-5.3-codex-spark
    capabilities:
      - implementation
      - refactoring
      - tests
    budget_class: M
    availability: supported
  micro_repair:
    model: gpt-5.3-codex-spark
    capabilities:
      - conflict_repair
      - lint_repair
      - tiny_patches
    budget_class: XS
    availability: supported
  cheap_router:
    model: gpt-5.4-mini
    capabilities:
      - routing
      - summarization
      - fallback_worker
    budget_class: S
    availability: supported

model_roles:
  worker:
    type: codex_cli
    model: gpt-5.3-codex-spark
    max_walltime_minutes: 25
    fallback_models:
      - gpt-5.3-codex
      - gpt-5.4-mini
  repair:
    type: codex_cli
    model: gpt-5.3-codex-spark
    max_walltime_minutes: 10
    fallback_models:
      - gpt-5.4-mini
  router:
    type: codex_cli
    model: gpt-5.4-mini
    max_walltime_minutes: 10
  reviewer:
    type: codex_cli
    model: gpt-5.2
    max_walltime_minutes: 20
    fallback_models:
      - gpt-5.5
  planner:
    type: codex_cli
    model: gpt-5.5
    max_walltime_minutes: 20

model_routing:
  default_role: worker
  task_type_roles:
    documentation: router
    release_preparation: reviewer
  budget_class_roles:
    L: reviewer
    XL: planner
  escalation_role: reviewer

release_finalization_policy:
  policy: pr_preparation
  required_credential_env_vars: []

verification_runtime:
  python_path: /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python
  env:
    PYTHONPATH: src

verification_profiles:
  default:
    commands:
      - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
  documentation:
    commands:
      - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
  code_only:
    commands:
      - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
  benchmark:
    commands:
      - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
  scientific_validation:
    commands:
      - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
  release_preparation:
    commands:
      - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest

unsafe_overlap_paths:
  - repo_state/**
  - contracts/**
  - objectives/**

feature_review_max_repair_loops: 2

budget:
  max_executor_attempts_per_task: 2
  max_strong_model_calls_per_release: 10
  max_changed_files_per_task: 8
  max_diff_lines_per_task: 600
  max_context_chars_per_task: 50000
