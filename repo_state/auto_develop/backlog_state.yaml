blocked_epics: []
candidate_epics:
- id: cost-runtime-governor
  title: Turn release metrics into runtime and model-routing decisions.
  rationale: Retained metrics show high repeated context volume, expensive review
    churn, and no actual billed-cost accounting; the governor should use those signals
    to choose one-shot versus decomposed execution, cap review waves, and route models.
  priority: 3
  next_release_id: cost-runtime-governor
- id: context-slimming-and-retrieval
  title: Build phase-specific context bundles for workers, reviewers, and repairs.
  rationale: Repair and review tasks often received large roadmap/design context bundles
    even when they only needed a finding, touched files, tests, and prior evidence.
  priority: 4
  next_release_id: context-slimming-and-retrieval
- id: executor-liveness-supervision
  title: Classify active, stalled, hung, and environment-blocked executors.
  rationale: Long-running workers need process/output/file heartbeat evidence so the
    supervisor can wait, inspect, restart, or stop without human guessing.
  priority: 5
  next_release_id: executor-liveness-supervision
- id: multi-epic-cockpit-log
  title: Provide one tail-able cockpit log across repeated epic cycles.
  rationale: Operators still correlate parent governor logs, child release logs, raw
    logs, review artifacts, and state refresh artifacts manually; one structured log
    should show what is being implemented, repaired, reviewed, finalized, and why
    the loop stopped.
  priority: 6
  next_release_id: multi-epic-cockpit-log
- id: target-artifact-ownership
  title: Store target development memory in the target repo or a durable control repo.
  rationale: Deleting and recloning the auto_develop controller should not lose target
    repo-state, objectives, contracts, completed-epic history, or next-epic planning
    context.
  priority: 7
  next_release_id: target-artifact-ownership
- id: onboarding-bootstrap
  title: Bootstrap a freshly cloned target repository from one or two onboarding prompts.
  rationale: The target operator experience is minimal setup followed by a high-level
    epic-count loop.
  priority: 8
  next_release_id: onboarding-bootstrap
