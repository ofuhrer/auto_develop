notes:
- supervisor-decision-records is now implemented with typed, versioned decision models,
  strict JSON artifact IO under supervisor_decisions directories, and a migrated task-level
  soft_budget_acceptance path that emits, reloads, and consumes the typed artifact
  without weakening hard gates.
- supervisor-owned-release-scheduling is now implemented with overlap-risk reports,
  strict release_scheduling decision artifacts, sequential serialization for normal
  source overlap, parallel execution for independent tasks, and deterministic rejection
  of stale or unsupported scheduling artifacts.
- The governor-loop-service-boundaries epic has now extracted GovernorLoop, StateStore,
  and RepairPolicy seams for one-epic autonomous execution, state persistence, and
  repair classification.
- Typed supervisor decision records are the immediate seam for auditable scheduling,
  repair continuation, finding adjudication, contract normalization, and environment
  repair.
- The runtime-supervisor-repair-loop epic is merged; the next planned increment should
  reduce brittle deterministic stops and improve environment/liveness supervision
  before the N-epic loop.
- The supervisor should turn structured release events into typed repair actions for
  stale editable installs, planner contract normalization, overlap risk decisions,
  soft-budget accept/split decisions, long-running-worker inspection, shared-runtime
  environment repair, release resume, and repo-state updates.
- 'Code-reduction target: retire deterministic heuristics for backlog scoring, contract
  wording repair, failure classification, budget-tuning prose, exact-overlap rejection,
  hard rejection for small budget overages, and elapsed-time-only liveness decisions
  once equivalent supervisor actions rerun hard validators.'
- The product-facing multi-epic loop should follow after runtime supervision can recover
  routine failures.
- Documentation and state-note updates must stay implementation-true and avoid describing
  the N-epic governor as already shipped.
- Service extraction is an enabling increment for autonomous roadmap-driven execution
  and repair, not cosmetic cleanup.
- Human review is an escalation boundary, not a routine planning gate.
- The governor should read release artifacts, metrics, budget ledgers, tuning reports,
  and validation outputs before choosing the next epic.
- The system should stop only for major problems such as exhausted autonomous repair,
  missing credentials, unsafe policy expansion, destructive operations not delegated,
  or no actionable work.
- Routine worker failures, invalid-but-useful planner output, flaky tests, and small
  local code errors should become autonomous repair/retry inputs.
- Hard deterministic gates remain for forbidden paths, generated artifacts, missing
  required evidence, unsafe finalization, credentials/network policy, destructive
  operations, and unrepaired verification failures.
- 'Soft findings need evidence-backed agent decisions: finding, severity, risk, decision,
  rationale, fallback plan, and validators rerun.'
- External target projects should keep durable `.auto_develop/repo_state`, objectives,
  contracts, and compact outcome history in the target repo or a dedicated control
  repo; raw runs remain local or archived evidence.
- Planner-generated contracts that are semantically useful but miss required evidence
  or use worktree-local .venv commands should become bounded normalization inputs,
  not manual repair points.
- Planner-output normalization and one-epic governor log artifacts are now implemented,
  but the N-epic cockpit still needs to link state review, feature review, repair
  loops, and next-epic selection across repeated cycles.
- The typed supervisor-decision seam is implemented for bounded soft decisions; the
  broader N-epic loop that would consume those decisions across repeated cycles remains
  planned.
- Multi-epic execution needs one parent governor.log/governor.raw.log/events.jsonl
  stream that links child release logs and exposes selected epic, contract normalization,
  release execution, release-local feature review, repair, finalization, state refresh,
  and next-epic selection.
- The release-local semantic review loop is implemented; the remaining gap is convergence
  policy and composition into the broader multi-epic governor.
- The model-output-normalization release is now implemented with typed normalization
  artifacts, validator-rerun metadata, and refusal boundaries that reject scope-broadening
  repairs; the broader N-epic governor loop remains planned.
- Before selecting the next epic, the governor should refresh its state view from
  source/branch status, recent run artifacts, release reviews, metrics, tuning reports,
  unresolved findings, docs drift, and tracked repo-state memory.
- The governor-state-review cycle was merged on 2026-05-13 and implemented deterministic
  state-review snapshot capture plus backlog-planning evidence linkage.
- Completed objectives and historical contracts have been removed from the controller
  repo after merge; current releases should generate fresh objective/contract artifacts
  instead of reusing stale landed packages.
- 'Prioritization rule as of 2026-05-13 after the one-shot comparison: execution-strategy
  selection first, model-output normalization second, review-loop convergence third,
  N-epic loop fourth. Running the N-epic loop before strategy selection and normalization
  would amplify over-decomposition, brittle schema stops, and review churn.'
- 'The persistent-governor-memory cycle showed that deterministic overlap stops should
  become supervisor scheduling decisions: overlap analysis emits facts, while the
  supervisor chooses sequential slices, stacked branches, replanning, or a hard stop
  for true exclusive paths.'
- Feature-review repair loops need convergence policy. Multiple repair passes are
  acceptable for blocking in-scope findings, but new adjacent quality findings after
  bounded repair should be classified as blocker, soft finding, duplicate, false positive,
  scope expansion, or backlog follow-up.
- Release-local convergence decisions are documented as evidence-backed review-loop
  outcomes; scope expansion and backlog follow-up should be captured as proposals
  rather than hidden inside the current feature branch.
- Code volume should decrease over time by moving judgment-heavy procedural heuristics
  into typed supervisor decision records, then rerunning hard validators. The repository
  should not accumulate parallel Python policy engines for every dogfood edge case.
- 'One-shot comparison finding: the experiment branch implementing the same frozen
  supervisor-owned scheduling epic with one high-capability agent changed the same
  files, passed the same tests, and produced a more coherent schema than the five-contract
  auto_develop run. The release run succeeded at worker isolation but blocked finalization
  on brittle reviewer-output validation. Execution strategy must be supervisor-owned
  before contract generation.'
- 'Architecture pivot as of 2026-05-13: keep Git/worktree, verification, evidence,
  metrics, typed persistence, and hard gates deterministic; move judgment-heavy choices
  into a high-level supervisor agent, including one-shot versus decomposition, reviewer-output
  normalization, finding adjudication, soft-budget acceptance, and retry/split/replan
  decisions.'
- The supervisor-execution-strategy and model-output-normalization epics are merged.
  The remaining product gap is no longer single-epic execution; it is closing the
  autonomous loop so the governor can run repeated epic cycles, update durable memory,
  finalize/clean feature branches, and continue without routine human steering.
- The review-loop-convergence-policy epic is merged. The release-local reviewer can
  now classify duplicate, soft, false-positive, scope-expansion, and backlog-follow-up
  findings with typed evidence.
- 'The last two cycles exposed the remaining autonomy gap: final review findings,
  merge/push/branch cleanup, and roadmap/backlog update decisions still required human
  interpretation even when code and tests were green.'
- Review repair should become a continuation state in the governor loop. Useful reviewer
  findings should produce bounded repair tasks or one-shot repair prompts, rerun verification/review,
  and only stop after repair budget, hard gates, unsafe policy expansion, missing
  credentials, or no actionable repair.
- 'Autonomous finalization needs explicit policy and state: accepted feature branches
  should be merged or turned into PR candidates, pushed, cleaned locally/remotely,
  and summarized into durable memory before the next epic starts.'
- 'The initial multi-epic-run-governor slice is implemented: `agent-loop run-governor
  --epic-count N` composes repeated one-epic cycles, writes parent governor logs/events,
  records completed epics, records recent release summaries, and stops on planning-only
  or non-accepted cycles by default.'
