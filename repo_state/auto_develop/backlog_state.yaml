active_goal: Enable a freshly onboarded auto_develop checkout and target repository
  to run a high-level autonomous development loop for the next N highest-value epics,
  with a governor/supervisor agent that chooses the execution strategy, uses one-shot
  implementation or decomposed sub-agents as appropriate, diagnoses and repairs contract-contained
  subsystem failures, normalizes useful model output before strict validation, and
  stops only for major hard-policy problems.
