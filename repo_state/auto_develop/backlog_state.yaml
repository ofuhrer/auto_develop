notes:
- 'Shipped seams: GovernorLoop, StateStore, RepairPolicy, typed supervisor decisions,
  runtime-supervisor repair/resume, release scheduling, planner-output normalization,
  release-local feature review, review-loop convergence, state-review snapshots, and
  the repeated `run-governor --epic-count N` shell. Reviewer- and supervisor-output
  normalization remain planned extensions on the same seam.'
- 'Architecture pivot: deterministic code owns Git/worktrees, verification, evidence,
  metrics, typed persistence, configured finalization mechanics, and hard gates. High-level
  supervisor agents should own judgment-heavy execution strategy, reviewer normalization,
  finding adjudication, retry/split/replan, soft-budget, and roadmap update decisions.'
- Hard gates remain for forbidden paths, generated artifacts, missing required evidence,
  unsafe finalization, credentials/network policy, destructive operations, and unrepaired
  verification failures. Routine schema drift, worker failures, flaky tests, stale
  installs, context sizing, and small code errors should become bounded repair inputs.
- 'Dogfood finding: one-shot high-capability agents produced coherent implementations
  faster than over-decomposed contract batches. Prioritize supervisor-owned execution
  strategy and normalization before expanding multi-epic autonomy.'
- 'Five-cycle dogfood review: 7 release attempts, 51 worker/reviewer task runs, 183.5
  executor minutes, 28.0 verification minutes, 1.84M prompt characters, 1.57M injected
  context characters, and 25.3MB of raw stderr/audit chatter. Main bottlenecks were
  shared runtime drift, repeated review convergence churn, coarse context slicing,
  incomplete cost governance, and manual finalization/state compaction.'
- 'Completed gap: hard file-count and diff-size budgets now produce supervisor-adjudicated
  scope-risk findings after hard gates pass, so broad-but-mechanical changes are no
  longer stopped automatically unless they cross a hard safety boundary.'
- 'Current top gap: shared verification runtime. Recent cycles still needed worktree-safe
  absolute runtime commands and worker-side `.venv` assumptions created false failures
  or noisy environment reports.'
- 'Next sequencing: shared-verification-runtime, review-stop-policy-hardening, environment-repair-actions,
  cost-runtime-governor, context-slimming-and-retrieval, executor-liveness-supervision,
  multi-epic-cockpit-log, target-artifact-ownership, onboarding-bootstrap.'
- Hard file-count and diff-size budgets are implemented as scope-risk signals for
  supervisor adjudication unless they cross configured hard-policy boundaries; broad
  mechanical changes require stronger verification, not automatic rejection.
- Review agents should stop after bounded repair waves. Remaining findings should
  be accepted, deferred, or blocked by a supervisor decision after final integration
  verification instead of letting reviewer churn expand indefinitely.
- External targets should retain compact durable `.auto_develop/repo_state`, objectives,
  contracts, and outcome history in the target or control repo; raw runs remain local
  or archived evidence.
- Keep repo-state memory compact. Historical lessons belong in design docs; backlog_state
  should carry only the current operating summary needed by planners and workers.
