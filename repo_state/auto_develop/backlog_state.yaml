blocked_epics: []
candidate_epics:
- id: multi-epic-run-governor-hardening
  title: Harden the initial repeated-epic governor loop.
  rationale: The initial run-governor command can run repeated one-epic cycles and
    record parent governor events. Remaining work is richer state refresh, no-actionable-work
    detection, final-review repair continuation, autonomous finalization/cleanup,
    and stronger stop taxonomy before unattended N-epic operation is credible.
  priority: 1
  next_release_id: multi-epic-run-governor-hardening
- id: review-repair-continuation
  title: Treat final feature-review findings as autonomous continuation inputs.
  rationale: The review-loop-convergence cycle still required a human to interpret
    final reviewer findings, patch evidence semantics, rerun verification, and decide
    whether the branch was mergeable. The supervisor should normalize reviewer output,
    classify findings, create bounded repairs or one-shot repair prompts, rerun verification/review,
    and stop only for exhausted repair budget, hard gates, policy, or missing credentials.
  priority: 2
  next_release_id: review-repair-continuation
- id: autonomous-finalization-and-cleanup
  title: Land accepted feature branches and clean branches/worktrees by policy.
  rationale: Successful child releases still need human merge/push/delete steps. The
    governor should merge or prepare a PR according to project policy, push the final
    branch, delete merged feature/agent branches locally and remotely, prune worktrees,
    and record durable finalization state before the next epic.
  priority: 3
  next_release_id: autonomous-finalization-and-cleanup
- id: governor-cockpit-v2
  title: Expand governor cockpit logging for full N-epic runs.
  rationale: Operators need one `governor.log` stream that links state review, backlog
    selection, child releases, feature reviews, repair loops, state refresh, and next-epic
    selection across repeated cycles.
  priority: 4
  next_release_id: governor-cockpit-v2
- id: shared-verification-runtime
  title: Make isolated worktrees run tests through a configured shared runtime.
  rationale: Sub-agents repeatedly could not run pytest because task worktrees do
    not contain .venv; verification should use project runtime policy rather than
    worktree-local assumptions.
  priority: 5
  next_release_id: shared-verification-runtime
- id: environment-repair-actions
  title: Repair safe verification-environment drift autonomously.
  rationale: Stale editable installs, command-not-found errors, missing PYTHONPATH,
    and dependency runtime drift should become bounded repair actions when project
    policy declares a safe repair.
  priority: 6
  next_release_id: environment-repair-actions
- id: executor-liveness-supervision
  title: Classify active, stalled, hung, and environment-blocked executors.
  rationale: Long-running workers need process/output/file heartbeat evidence so the
    supervisor can wait, inspect, restart, or stop without human guessing.
  priority: 7
  next_release_id: executor-liveness-supervision
- id: target-artifact-ownership
  title: Store target development memory in the target repo or a durable control repo.
  rationale: Deleting and recloning the auto_develop controller should not lose target
    repo-state, objectives, contracts, completed-epic history, or next-epic planning
    context.
  priority: 8
  next_release_id: target-artifact-ownership
- id: governor-state-refresh
  title: Apply roadmap and repo-state updates after each epic.
  rationale: Ensures new learnings from artifacts, validation, metrics, review findings,
    and documentation feed the next planning cycle.
  priority: 9
  next_release_id: governor-state-refresh
- id: onboarding-bootstrap
  title: Bootstrap a freshly cloned target repository from one or two onboarding prompts.
  rationale: The target operator experience is minimal setup followed by a high-level
    epic-count loop.
  priority: 10
  next_release_id: onboarding-bootstrap
