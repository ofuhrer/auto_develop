active_goal: Enable a freshly onboarded auto_develop checkout and target repository to run a high-level autonomous development loop for the next N highest-value epics, with a runtime supervisor that diagnoses, repairs, and resumes contract-contained subsystem failures without routine human intervention.
governor_mode: autonomous_first
current_focus: review-loop-convergence-policy
active_epic: null
completed_epics:
  - release-governor-1
  - adaptive-model-hierarchy
  - run-backlog
  - governor-loop-service-boundaries
  - runtime-supervisor-repair-loop
  - agent-governed-soft-gates
  - governor-log-and-contract-normalization
  - governor-state-review
  - agentic-feature-review-loop
  - persistent-governor-memory
  - supervisor-decision-records
  - supervisor-owned-release-scheduling
blocked_epics: []
candidate_epics:
  - id: review-loop-convergence-policy
    priority: 1
    title: Add convergence policy for reviewer repair loops.
    rationale: Multiple repair passes are useful for blocking findings, but repeated adjacent findings should be classified as blockers, soft findings, duplicates, false positives, scope expansion, or backlog follow-ups before retry budget churn.
    next_release_id: review-loop-convergence-policy
  - id: multi-epic-run-governor
    priority: 2
    title: Run the next N highest-priority epics autonomously.
    rationale: Converts one-epic run-backlog into the intended high-level development loop after state review, feature review, persistent memory, and supervisor decision records can prevent stale work and procedural stops.
    next_release_id: multi-epic-run-governor
  - id: governor-cockpit-v2
    priority: 3
    title: Expand governor cockpit logging for full N-epic runs.
    rationale: Operators need one `governor.log` stream that links state review, backlog selection, child releases, feature reviews, repair loops, state refresh, and next-epic selection across repeated cycles.
    next_release_id: governor-cockpit-v2
  - id: shared-verification-runtime
    priority: 4
    title: Make isolated worktrees run tests through a configured shared runtime.
    rationale: Sub-agents repeatedly could not run pytest because task worktrees do not contain .venv; verification should use project runtime policy rather than worktree-local assumptions.
    next_release_id: shared-verification-runtime
  - id: environment-repair-actions
    priority: 5
    title: Repair safe verification-environment drift autonomously.
    rationale: Stale editable installs, command-not-found errors, missing PYTHONPATH, and dependency runtime drift should become bounded repair actions when project policy declares a safe repair.
    next_release_id: environment-repair-actions
  - id: executor-liveness-supervision
    priority: 6
    title: Classify active, stalled, hung, and environment-blocked executors.
    rationale: Long-running workers need process/output/file heartbeat evidence so the supervisor can wait, inspect, restart, or stop without human guessing.
    next_release_id: executor-liveness-supervision
  - id: target-artifact-ownership
    priority: 7
    title: Store target development memory in the target repo or a durable control repo.
    rationale: Deleting and recloning the auto_develop controller should not lose target repo-state, objectives, contracts, completed-epic history, or next-epic planning context.
    next_release_id: target-artifact-ownership
  - id: governor-state-refresh
    priority: 8
    title: Apply roadmap and repo-state updates after each epic.
    rationale: Ensures new learnings from artifacts, validation, metrics, review findings, and documentation feed the next planning cycle.
    next_release_id: governor-state-refresh
  - id: onboarding-bootstrap
    priority: 9
    title: Bootstrap a freshly cloned target repository from one or two onboarding prompts.
    rationale: The target operator experience is minimal setup followed by a high-level epic-count loop.
    next_release_id: onboarding-bootstrap
last_reviewed: 2026-05-13
notes:
  - supervisor-decision-records is now implemented with typed, versioned decision models, strict JSON artifact IO under supervisor_decisions directories, and a migrated task-level soft_budget_acceptance path that emits, reloads, and consumes the typed artifact without weakening hard gates.
  - supervisor-owned-release-scheduling is now implemented with overlap-risk reports, strict release_scheduling decision artifacts, sequential serialization for normal source overlap, parallel execution for independent tasks, and deterministic rejection of stale or unsupported scheduling artifacts.
  - The governor-loop-service-boundaries epic has now extracted GovernorLoop, StateStore, and RepairPolicy seams for one-epic autonomous execution, state persistence, and repair classification.
  - Typed supervisor decision records are the immediate seam for auditable scheduling, repair continuation, finding adjudication, contract normalization, and environment repair.
  - The runtime-supervisor-repair-loop epic is merged; the next planned increment should reduce brittle deterministic stops and improve environment/liveness supervision before the N-epic loop.
  - The supervisor should turn structured release events into typed repair actions for stale editable installs, planner contract normalization, overlap risk decisions, soft-budget accept/split decisions, long-running-worker inspection, shared-runtime environment repair, release resume, and repo-state updates.
  - "Code-reduction target: retire deterministic heuristics for backlog scoring, contract wording repair, failure classification, budget-tuning prose, exact-overlap rejection, hard rejection for small budget overages, and elapsed-time-only liveness decisions once equivalent supervisor actions rerun hard validators."
  - The product-facing multi-epic loop should follow after runtime supervision can recover routine failures.
  - Documentation and state-note updates must stay implementation-true and avoid describing the N-epic governor as already shipped.
  - Service extraction is an enabling increment for autonomous roadmap-driven execution and repair, not cosmetic cleanup.
  - Human review is an escalation boundary, not a routine planning gate.
  - The governor should read release artifacts, metrics, budget ledgers, tuning reports, and validation outputs before choosing the next epic.
  - The system should stop only for major problems such as exhausted autonomous repair, missing credentials, unsafe policy expansion, destructive operations not delegated, or no actionable work.
  - Routine worker failures, invalid-but-useful planner output, flaky tests, and small local code errors should become autonomous repair/retry inputs.
  - Hard deterministic gates remain for forbidden paths, generated artifacts, missing required evidence, unsafe finalization, credentials/network policy, destructive operations, and unrepaired verification failures.
  - "Soft findings need evidence-backed agent decisions: finding, severity, risk, decision, rationale, fallback plan, and validators rerun."
  - External target projects should keep durable `.auto_develop/repo_state`, objectives, contracts, and compact outcome history in the target repo or a dedicated control repo; raw runs remain local or archived evidence.
  - Planner-generated contracts that are semantically useful but miss required evidence or use worktree-local .venv commands should become bounded normalization inputs, not manual repair points.
  - Planner-output normalization and one-epic governor log artifacts are now implemented, but the N-epic cockpit still needs to link state review, feature review, repair loops, and next-epic selection across repeated cycles.
  - The typed supervisor-decision seam is implemented for bounded soft decisions; the broader N-epic loop that would consume those decisions across repeated cycles remains planned.
  - Multi-epic execution needs one parent governor.log/governor.raw.log/events.jsonl stream that links child release logs and exposes selected epic, contract normalization, release execution, release-local feature review, repair, finalization, state refresh, and next-epic selection.
  - The release-local semantic review loop is implemented; the remaining gap is convergence policy and composition into the broader multi-epic governor.
  - Before selecting the next epic, the governor should refresh its state view from source/branch status, recent run artifacts, release reviews, metrics, tuning reports, unresolved findings, docs drift, and tracked repo-state memory.
  - The governor-state-review cycle was merged on 2026-05-13 and implemented deterministic state-review snapshot capture plus backlog-planning evidence linkage.
  - Completed objectives and historical contracts have been removed from the controller repo after merge; current releases should generate fresh objective/contract artifacts instead of reusing stale landed packages.
  - "Prioritization rule as of 2026-05-13 after supervisor-decision-records merge: scheduling decisions first, review-loop convergence second, N-epic loop third. Running the N-epic loop before supervisor-owned scheduling and convergence policy would amplify deterministic stops and review churn."
  - The persistent-governor-memory cycle showed that deterministic overlap stops should become supervisor scheduling decisions: overlap analysis emits facts, while the supervisor chooses sequential slices, stacked branches, replanning, or a hard stop for true exclusive paths.
  - Feature-review repair loops need convergence policy. Multiple repair passes are acceptable for blocking in-scope findings, but new adjacent quality findings after bounded repair should be classified as blocker, soft finding, duplicate, false positive, scope expansion, or backlog follow-up.
  - Code volume should decrease over time by moving judgment-heavy procedural heuristics into typed supervisor decision records, then rerunning hard validators. The repository should not accumulate parallel Python policy engines for every dogfood edge case.
