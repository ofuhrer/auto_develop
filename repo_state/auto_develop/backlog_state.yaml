active_goal: Enable a freshly onboarded auto_develop checkout and target repository to run a high-level autonomous development loop for the next N highest-value epics, with a runtime supervisor that diagnoses, repairs, and resumes contract-contained subsystem failures without routine human intervention.
governor_mode: autonomous_first
current_focus: agent-governed-soft-gates
active_epic: agent-governed-soft-gates
completed_epics:
  - release-governor-1
  - adaptive-model-hierarchy
  - run-backlog
  - governor-loop-service-boundaries
  - runtime-supervisor-repair-loop
blocked_epics: []
candidate_epics:
  - id: agent-governed-soft-gates
    title: Move soft review findings from deterministic rejection to supervisor/reviewer judgment.
    rationale: Dogfooding showed that exact overlap and small budget overages are often risk-management decisions, not hard safety violations.
  - id: shared-verification-runtime
    title: Make isolated worktrees run tests through a configured shared runtime.
    rationale: Sub-agents repeatedly could not run pytest because task worktrees do not contain .venv; verification should use project runtime policy rather than worktree-local assumptions.
  - id: executor-liveness-supervision
    title: Classify active, stalled, hung, and environment-blocked executors.
    rationale: Long-running workers need process/output/file heartbeat evidence so the supervisor can wait, inspect, restart, or stop without human guessing.
  - id: target-artifact-ownership
    title: Store target development memory in the target repo or a durable control repo.
    rationale: Deleting and recloning the auto_develop controller should not lose target repo-state, objectives, contracts, completed-epic history, or next-epic planning context.
  - id: multi-epic-run-governor
    title: Run the next N highest-priority epics autonomously.
    rationale: Converts one-epic run-backlog into the intended high-level development loop after runtime supervision can recover routine failures.
  - id: persistent-backlog-state
    title: Track completed, skipped, blocked, and active epics across runs.
    rationale: Prevents duplicate work and lets the governor reason over long-running development history.
  - id: autonomous-repair-retry
    title: Repair and retry contract-contained subsystem failures before stopping.
    rationale: Full-pass dogfooding showed planner schema drift, verification environment drift, and small worker bugs should be fixed by the system.
  - id: governor-state-refresh
    title: Apply roadmap and repo-state updates after each epic.
    rationale: Ensures new learnings from artifacts, validation, metrics, and documentation feed the next planning cycle.
  - id: onboarding-bootstrap
    title: Bootstrap a freshly cloned target repository from one or two onboarding prompts.
    rationale: The target operator experience is minimal setup followed by a high-level epic-count loop.
last_reviewed: 2026-05-13
notes:
  - The governor-loop-service-boundaries epic has now extracted GovernorLoop, StateStore, and RepairPolicy seams for one-epic autonomous execution, state persistence, and repair classification.
  - The runtime-supervisor-repair-loop epic is merged; the next planned increment should reduce brittle deterministic stops and improve environment/liveness supervision before the N-epic loop.
  - The supervisor should turn structured release events into typed repair actions for stale editable installs, planner contract normalization, overlap risk decisions, soft-budget accept/split decisions, long-running-worker inspection, shared-runtime environment repair, release resume, and repo-state updates.
  - Code-reduction target: retire deterministic heuristics for backlog scoring, contract wording repair, failure classification, budget-tuning prose, exact-overlap rejection, hard rejection for small budget overages, and elapsed-time-only liveness decisions once equivalent supervisor actions rerun hard validators.
  - The product-facing multi-epic loop should follow after runtime supervision can recover routine failures.
  - Documentation and state-note updates must stay implementation-true and avoid describing the N-epic governor as already shipped.
  - Service extraction is an enabling increment for autonomous roadmap-driven execution and repair, not cosmetic cleanup.
  - Human review is an escalation boundary, not a routine planning gate.
  - The governor should read release artifacts, metrics, budget ledgers, tuning reports, and validation outputs before choosing the next epic.
  - The system should stop only for major problems such as exhausted autonomous repair, missing credentials, unsafe policy expansion, destructive operations not delegated, or no actionable work.
  - Routine worker failures, invalid-but-useful planner output, flaky tests, and small local code errors should become autonomous repair/retry inputs.
  - Hard deterministic gates remain for forbidden paths, generated artifacts, missing required evidence, unsafe finalization, credentials/network policy, destructive operations, and unrepaired verification failures.
  - Soft findings need evidence-backed agent decisions: finding, severity, risk, decision, rationale, fallback plan, and validators rerun.
  - External target projects should keep durable `.auto_develop/repo_state`, objectives, contracts, and compact outcome history in the target repo or a dedicated control repo; raw runs remain local or archived evidence.
