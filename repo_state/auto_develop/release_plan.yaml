release_id: multi-epic-run-governor
active_objective: "Close the autonomous development loop so a high-level governor can run multiple epic cycles, repair final-review findings, finalize accepted branches by policy, clean artifacts, refresh durable state, and continue until count, budget, no-actionable-work, or major hard-policy stop."
current_tasks: []
next_steps:
  - Keep the implemented runtime-supervisor, planner-normalization, one-epic governor logging behavior, typed supervisor decision records, supervisor-owned release scheduling, and semantic feature-review loop aligned with docs.
  - Treat governor-state-review, agentic-feature-review-loop, persistent-governor-memory, supervisor-decision-records, supervisor-owned-release-scheduling, supervisor-execution-strategy, and model-output-normalization as completed for the current cycle.
  - Treat review-loop convergence as implemented for release-local duplicate, soft, false-positive, scope-expansion, and backlog-follow-up findings.
  - Close the autonomous loop next: add a top-level repeated-epic governor mode that accepts an epic count, refreshes state before each epic, selects the highest-value next epic, chooses execution strategy, runs/reviews/repairs/finalizes, updates durable memory, cleans feature/agent branches, and continues until budget, count, no-actionable-work, or hard-policy stop.
  - Add autonomous final-review repair continuation so reviewer findings create bounded repair tasks or one-shot repair prompts, rerun verification/review, and stop only after repair budget, hard gates, policy, missing credentials, or no actionable repair.
  - Add autonomous finalization policy so accepted feature branches are merged or prepared as PR candidates, pushed, cleaned locally/remotely, and summarized into durable state before the next epic starts.
  - Model-output normalization is now implemented so semantically useful planner/reviewer/supervisor output with bounded schema defects is repaired before strict typed validation, but only when the repair stays within the original objective and allowed scope.
  - Preserve the implemented repair/resume seam while the broader N-epic governor loop remains planned until review convergence and repeated-cycle state refresh exist.
  - "Identify procedural heuristics that can be retired once supervisor actions and the broader governor loop exist: deterministic backlog scoring, contract wording checks, raw reviewer-output hard stops, log-pattern failure classification, budget-tuning prose, hard rejection for small budget overages, environment-command assumptions, and cockpit-summary filtering."
  - Keep deterministic gates authoritative for hard invariants; let the supervisor or reviewer agent decide soft findings such as modest budget overage, source-file overlap, model escalation, retry strategy, and environment repair with auditable rationale.
  - Add shared verification-runtime policy so isolated worktrees can run tests without requiring a per-worktree .venv.
  - Add executor liveness classification from process, output, heartbeat, and file/diff activity before declaring workers stuck.
  - Add bounded planner-output normalization before generated-contract admission stops for repairable issues such as missing required evidence or worktree-local verification commands.
  - Expand the top-level governor log stream so one file can be watched while state review, backlog planning, contract generation, release execution, feature review, repair, state refresh, and next-epic selection proceed.
  - Document shipped behavior while keeping unimplemented state-review decisioning, persistent memory, and multi-epic loops explicitly planned.
  - Keep `release_review.md` documented as a deterministic evidence summary and `feature_review.json` / `feature_review_recheck.json` documented as the semantic reviewer artifacts when reviewer routing is configured.
  - "The release scheduling, execution-strategy, model-output-normalization, and review-loop-convergence epics are implemented on main. The next architectural increment should close the repeated-epic autonomous loop, including final-review repair continuation and autonomous finalization/cleanup."
