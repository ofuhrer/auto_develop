release_id: runtime-supervisor-repair-loop
active_objective: Add a runtime supervisor that observes release events and evidence, diagnoses recoverable failures, applies bounded repair actions, and resumes execution without routine human intervention.
current_tasks:
  - runtime-supervisor-events
  - runtime-supervisor-policy-actions
  - runtime-supervisor-repair-executors
  - runtime-supervisor-resume-loop
  - runtime-supervisor-docs-state
next_steps:
  - Define a machine-readable release event stream that mirrors the human cockpit log but is suitable for supervisor decisions.
  - Connect RepairPolicy categories to typed repair actions with retry budgets and stop reasons.
  - Implement bounded repair executors for environment repair, contract normalization, contract splitting, scope narrowing, release resume, long-running-worker inspection, model escalation, and repo-state updates.
  - Identify procedural heuristics that can be retired once supervisor actions exist: deterministic backlog scoring, contract wording checks, log-pattern failure classification, budget-tuning prose, overlap recovery branching, and cockpit-summary filtering.
  - Keep deterministic gates authoritative; the supervisor must repair inputs and rerun gates, not bypass them.
  - Document the supervisor as planned until implementation and tests land.
