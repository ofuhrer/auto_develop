constraints:
  - Task contracts define allowed files and forbidden changes.
  - Verification must run before deterministic acceptance.
  - Evidence bundles are authoritative; executor summaries are supporting context only.
  - The default workflow is autonomous-first: humans provide goals, credentials, and hard policy boundaries, not routine approval gates.
  - Commit, merge, and push follow configured autonomous finalization policy and must remain auditable.
  - Generated run evidence under runs/ is local and ignored by Git.
  - The roadmap governor must update backlog and repo-state memory from run artifacts, metrics, tuning reports, validation output, and new domain learnings.
  - Before selecting an epic, the governor should refresh its state view from source status, branch state, recent release artifacts, release reviews, metrics, tuning reports, unresolved findings, docs drift, and tracked repo-state memory.
  - Integrated feature branches should receive an independent reviewer-agent pass before PR creation, merge to main, or autonomous finalization.
  - Required reviewer findings should become bounded repair contracts for repair agents, followed by verification reruns and reviewer re-checks.
  - The runtime supervisor may repair contract-contained failures, but must not bypass deterministic contract admission, verification, review, budget, or finalization gates.
  - The implemented runtime supervisor may normalize planner output, inspect long-running workers, and propose repo-state updates, but it must keep retry budgets, allowed-file boundaries, and hard gates intact.
  - Routine failures such as planner schema drift, stale local environment, long-running-but-active workers, over-broad contract scope, file-overlap admission failures, and needs-revision task sizing should trigger bounded repair/resume before human escalation.
