- Do not implement finalization or cleanup behavior in this task.
- Do not collapse distinct stop reasons into generic failure values.
required_evidence:
- git diff
- pytest output for governor stop taxonomy serialization
- CLI JSON output fixture/assertion showing typed stop_reason values
