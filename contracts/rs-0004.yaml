task_id: rs-0004
release_id: runtime-supervisor-repair-loop
title: Normalize planner schema drift through supervisor
task_type: code_only
budget_class: M
objective: Integrate RuntimeSupervisor into planner result handling so supported planner
  schema drift can be normalized once before existing ContractPlan and TaskContract
  validation. Stop with structured evidence when generated work is over-budget, over-broad,
  or cannot be normalized without changing meaning. Add tests for successful schema
  normalization, over-broad allowed_files stop, and budget-exceeded generated work
  stop.
allowed_files:
- src/agentic_devloop/planning.py
- src/agentic_devloop/objective.py
- src/agentic_devloop/runtime_supervisor.py
- tests/test_planning.py
- tests/test_objective.py
- tests/test_runtime_supervisor.py
forbidden_changes:
- Do not weaken validate_generated_contracts checks for whole-repo allowed_files,
  required diff evidence, stop conditions, profile validation, or max_changed_files_per_task.
- Do not let the supervisor invent implementation scope that was absent from the planner
  output.
- Do not modify release execution control flow in this task.
- Do not change planner prompt text except where needed to reference structured repair
  evidence paths.
- Do not overwrite existing contract files during normalization tests.
required_evidence:
- git diff
- focused planning pytest output
- focused objective pytest output
- focused RuntimeSupervisor pytest output
- changed-files list
verification:
  commands: []
  profile: code_only
stop_conditions:
- Stop if normalization would require accepting a contract that fails existing TaskContract
  validation.
- Stop if schema drift cannot be repaired without changing task objective or allowed_files
  semantics.
- Stop if over-broad work cannot be narrowed to a strict subset with explicit evidence.
- Stop if adding repair evidence requires changing the ContractPlan schema in a way
  that breaks existing callers.
non_goals:
- Do not execute release repairs.
- Do not implement CLI changes.
- Do not update docs or repo_state notes.
- Do not add a broad planner retry loop.
scientific_assumptions:
- Not applicable; developer tooling task.
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- rs-0002
