task_id: model-output-normalization-0002
release_id: model-output-normalization
title: Route invalid planner contract output through bounded normalization
task_type: code_only
budget_class: M
objective: Update planner contract admission so raw planner outputs that fail ContractPlan
  or TaskContract validation are captured with validation errors, passed through bounded
  normalization for wrapper/schema drift, missing derivable evidence, and worktree-local
  runtime assumptions, persisted as typed model-output normalization supervisor decisions,
  then revalidated by deterministic generated-contract validators before admission
  or hard stop.
allowed_files:
- src/agentic_devloop/planning.py
- src/agentic_devloop/contracts.py
- tests/test_contract_normalization.py
- tests/test_planning.py
forbidden_changes:
- Do not broaden allowed_files, forbidden_changes, depends_on, task objective, or
  semantic contract intent during normalization.
- Do not admit contracts that still fail TaskContract, ContractPlan, validate_generated_contracts,
  unsafe path, missing non-derivable evidence, or unverifiable command checks.
- Do not edit reviewer, release execution, runtime supervisor, CLI, docs, repo_state,
  generated artifacts, or runtime evidence in this task.
required_evidence:
- git diff
- pytest output for planner and contract normalization tests
- normalization decision artifact path or fixture reload assertion
- negative test output for rejected semantic changes
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_contract_normalization.py tests/test_planning.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if bounded normalization cannot preserve task intent while repairing generated-contract
  schema drift.
- Stop if deterministic validators would need to be bypassed, weakened, or reordered
  after normalization.
- Stop if supervisor normalization decision persistence requires edits outside the
  allowed files.
non_goals:
- Do not implement reviewer output normalization.
- Do not implement supervisor decision candidate normalization.
- Do not change planner prompt wording except where needed to surface normalization
  evidence.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- model-output-normalization-0001
