task_id: pgm-0003
release_id: persistent-governor-memory
title: Persist reviewer findings and repair memory
task_type: code_only
budget_class: M
objective: 'Extend durable outcome ingestion so feature review decisions and recheck
  records persist compact finding memory: unresolved required finding IDs, optional
  accepted-with-rationale finding IDs, accepted risk rationale, retry exhaustion stop
  reasons, repair attempt counts, blocked reasons, affected files, and source artifact
  paths. Ensure future state loads validate this structure and keep findings deduplicated
  by stable finding ID and release ID.'
allowed_files:
- src/agentic_devloop/state_store.py
- src/agentic_devloop/release.py
- src/agentic_devloop/feature_review.py
- tests/test_state_store.py
- tests/test_feature_review.py
- tests/test_release.py
forbidden_changes:
- Do not change the FeatureReviewDecision or FeatureReviewRecheckRecord public JSON
  taxonomy unless existing tests and docs are updated by a later documentation task.
- Do not mark unresolved required findings as accepted unless feature_review.json
  already contains accepted_risks or the recheck record classifies them as accepted_finding_ids.
- Do not persist full reviewer prompts, full diffs, or full raw stdout/stderr into
  repo_state.
- Do not loosen finalization gating for unresolved required findings.
- Do not modify repair contract generation allowed_files semantics.
required_evidence:
- git diff
- changed-files list
- pytest output for tests/test_state_store.py tests/test_feature_review.py tests/test_release.py
- test assertion showing unresolved and accepted-with-rationale findings are persisted
  separately
- git diff --check output
verification:
  commands:
  - /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_state_store.py
    tests/test_feature_review.py tests/test_release.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if existing feature_review_recheck.json fields are insufficient to distinguish
  unresolved, resolved, and accepted finding IDs without changing release semantics.
- Stop if stable finding identity cannot be maintained across repeated ingestion of
  the same release artifacts.
- Stop if implementing this requires broad changes to executor, worktree, or git finalization
  code.
- Stop if persistence would conflict with the existing blocked_by_retry_budget and
  blocked_by_hard_gate taxonomy.
non_goals:
- Do not add backlog duplicate rejection.
- Do not write documentation in this task.
- Do not create a human review workflow.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- pgm-0002
