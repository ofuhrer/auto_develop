task_id: model-output-normalization-0003
release_id: model-output-normalization
title: Normalize repairable reviewer artifact defects before hard stop
task_type: code_only
budget_class: M
objective: Route invalid feature reviewer raw output through a bounded normalization
  step that captures raw output paths and validation errors, repairs wrapper/schema
  drift and empty evidence_paths only when evidence is derivable from existing release
  or review artifacts, persists a typed model-output normalization supervisor decision,
  reruns ReviewDecision and feature-review validators, and refuses semantic finding
  changes.
allowed_files:
- src/agentic_devloop/feature_review.py
- src/agentic_devloop/release.py
- tests/test_feature_review.py
- tests/test_release.py
forbidden_changes:
- Do not change reviewer finding severity, requiredness, affected files, remediation
  intent, or accept/reject semantics during normalization.
- Do not synthesize non-derivable evidence paths or admit findings whose evidence
  cannot be tied to existing release, review, diff, verification, or artifact paths.
- Do not modify planner normalization, supervisor decision model definitions, CLI
  output, docs, repo_state, generated artifacts, or runtime evidence in this task.
required_evidence:
- git diff
- pytest output for feature review and release reviewer-normalization tests
- fixture or test evidence showing empty derivable evidence_paths are normalized
- negative test output showing semantic reviewer finding changes are rejected
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_feature_review.py tests/test_release.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if reviewer normalization cannot distinguish derivable missing evidence paths
  from missing non-derivable evidence.
- Stop if implementation requires weakening ReviewDecision, finding, or feature-review
  recheck validation.
- Stop if tests require edits outside the allowed files.
non_goals:
- Do not change planner contract normalization.
- Do not add review-loop convergence policy.
- Do not change deterministic reviewer behavior beyond the invalid-output normalization
  path.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- model-output-normalization-0001
