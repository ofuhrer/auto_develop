task_id: governor-service-state-notes
release_id: governor-service-boundaries
title: Record governor service seam learnings in repo-state
task_type: documentation
budget_class: M

objective: >
  Update self repo-state notes for auto_develop to record the implemented
  GovernorLoop, StateStore, and RepairPolicy seams, the failed over-broad docs
  task learning, and the remaining planned multi-epic governor work.

allowed_files:
  - repo_state/auto_develop/architecture_summary.md
  - repo_state/auto_develop/backlog_state.yaml
  - repo_state/auto_develop/known_failures.md
  - repo_state/auto_develop/release_plan.yaml

forbidden_changes:
  - Do not edit source code, tests, user documentation, contracts, or objectives.
  - Do not mark multi-epic looping as implemented unless the code actually supports it.
  - Do not update unrelated project repo-state under repo_state/rust_rockfall/.
  - Do not commit generated run evidence under runs/.

required_evidence:
  - git diff
  - repo-state diff showing implemented versus planned behavior
  - focused repo-state grep output for GovernorLoop, StateStore, RepairPolicy, and multi-epic
  - changed-files list

verification:
  profile: documentation

stop_conditions:
  - Stop if repo-state YAML edits would invalidate existing schema expectations.
  - Stop if code changes are needed to make the repo-state notes true.
  - Stop if generated evidence or runtime artifacts appear in the diff.
  - Stop if state-note scope expands beyond governor service boundaries and immediate release learnings.

non_goals:
  - Do not add new CLI examples.
  - Do not change command behavior.
  - Do not edit user-facing docs in this task.

scientific_assumptions:
  - Not applicable; repo-state documentation task.

depends_on:
  - governor-service-docs

