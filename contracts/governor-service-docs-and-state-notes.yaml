task_id: governor-service-docs-and-state-notes
release_id: governor-service-boundaries
title: Document implemented governor seams
task_type: documentation
budget_class: M

objective: >
  Update documentation and self repo-state notes to describe the newly
  implemented one-epic GovernorLoop service, StateStore typed persistence seam,
  and RepairPolicy decision seam. Clearly mark multi-epic looping, state refresh
  automation, and full repair strategies as planned unless implemented by
  earlier tasks.

allowed_files:
  - docs/USER_GUIDE.md
  - docs/README.md
  - docs/design/ARCHITECTURE.md
  - docs/design/CRITICAL_ASSESSMENT.md
  - docs/design/ROADMAP_AND_BACKLOG.md
  - repo_state/auto_develop/architecture_summary.md
  - repo_state/auto_develop/backlog_state.yaml
  - repo_state/auto_develop/known_failures.md
  - repo_state/auto_develop/release_plan.yaml

forbidden_changes:
  - Do not edit source code or tests.
  - Do not document N-epic looping as implemented unless the code actually supports it.
  - Do not remove existing safety guidance for worktrees, cleanup, or finalization.
  - Do not commit generated run evidence under runs/.
  - Do not update unrelated project repo-state under repo_state/rust_rockfall/.

required_evidence:
  - git diff
  - documentation diff showing implemented versus planned behavior
  - focused documentation grep output for GovernorLoop, StateStore, RepairPolicy, and multi-epic
  - changed-files list

verification:
  profile: documentation

stop_conditions:
  - Stop if code changes are needed to make the documentation true.
  - Stop if docs would need to describe unimplemented multi-epic execution as current behavior.
  - Stop if repo-state YAML edits would invalidate existing schema expectations.
  - Stop if generated evidence or runtime artifacts appear in the diff.
  - Stop if documentation scope expands beyond governor service boundaries.

non_goals:
  - Do not add new CLI examples for unsupported multi-epic loops.
  - Do not change command behavior.
  - Do not edit broad roadmap sections unrelated to governor service boundaries.

scientific_assumptions:
  - Not applicable; documentation task.

depends_on:
  - governor-loop-one-epic-service

