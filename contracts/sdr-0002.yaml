task_id: sdr-0002
release_id: supervisor-decision-records
title: Persist and load supervisor decision artifacts
task_type: code_only
budget_class: M
objective: Implement deterministic persistence helpers for supervisor decision records, including artifact path construction, JSON serialization, loading, validation, and missing-evidence failure behavior.
allowed_files:
  - src/agentic_devloop/supervisor_decisions.py
  - src/agentic_devloop/evidence.py
  - tests/test_supervisor_decision_artifacts.py
  - docs/DEVELOPMENT.md
forbidden_changes:
  - Do not alter run-task or run-release control flow.
  - Do not add generated files under runs/.
  - Do not make missing evidence paths a warning-only condition.
  - Do not add network access, credentials handling, or external service dependencies.
  - Do not change cleanup semantics.
required_evidence:
  - git diff
  - changed-files list
  - pytest output for supervisor decision artifact tests
  - compileall output
  - git diff --check output
verification:
  commands:
    - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_supervisor_decision_artifacts.py tests/test_supervisor_decisions.py
    - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m compileall src
    - git diff --check
  profile: null
stop_conditions:
  - Stop if there is no existing evidence path abstraction and adding one would require a broad evidence-system refactor.
  - Stop if artifact persistence cannot be tested entirely in temporary directories.
  - Stop if any persistence helper would silently ignore malformed or missing evidence.
non_goals:
  - Do not consume decision artifacts from release orchestration.
  - Do not implement scheduling or review-loop convergence policy.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
  - sdr-0001
