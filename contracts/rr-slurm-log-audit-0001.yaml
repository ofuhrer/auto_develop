task_id: rr-slurm-log-audit-0001
release_id: rr-slurm-log-audit-1
title: Add SLURM collector log warning/error summary
task_type: code_only
budget_class: M
objective: >
  Extend `scripts/collect_balfrin_probe_metrics.py` so collected Balfrin probe
  summaries include a deterministic log-audit section for files under
  `<run_root>/logs`. The summary should count warning/error-like lines, record
  affected log paths, and remain stable when logs are absent.
allowed_files:
  - scripts/collect_balfrin_probe_metrics.py
  - tests/test_balfrin_probe_driver.py
forbidden_changes:
  - Do not modify Rust simulation code.
  - Do not modify hazard-layer generation semantics.
  - Do not change validation fixtures, numerical tolerances, or tracked probe definitions.
  - Do not submit SLURM jobs or require Balfrin access.
required_evidence:
  - git diff
  - focused unittest output
  - repo consistency output
  - changed-files list
verification:
  commands:
    - python3 -m unittest tests/test_balfrin_probe_driver.py
    - python3 scripts/check_repo_consistency.py
stop_conditions:
  - More than 2 tracked files need changes.
  - More than 300 diff lines are required.
  - Any change would alter simulation physics, validation semantics, or tracked probe definitions.
  - Verification fails twice.
non_goals:
  - Do not document repeat/reuse evidence in this task; that is the follow-up docs task.
