task_id: pgm-0005
release_id: persistent-governor-memory
title: Surface auditable repo-state update evidence
task_type: code_only
budget_class: S
objective: Add explicit state update evidence paths and summary entries for durable
  repo-state writes performed by release outcome ingestion and backlog planning. Ensure
  backlog_plan.json continues to surface roadmap_updates and repo_state_updates, release
  summaries or review artifacts reference the repo-state update artifact when written,
  and tests verify updates are auditable and deterministic.
allowed_files:
- src/agentic_devloop/backlog.py
- src/agentic_devloop/release.py
- src/agentic_devloop/models.py
- tests/test_backlog.py
- tests/test_release.py
- tests/test_models.py
forbidden_changes:
- Do not silently edit docs/design/ROADMAP_AND_BACKLOG.md or any repo_state file from
  backlog planning unless an existing explicit write path requests it.
- Do not add broad artifact globs to evidence models.
- Do not break existing BacklogEvidenceManifest validation for older artifacts.
- Do not make release_summary.json depend on non-deterministic ordering of state records.
- Do not change CLI output from machine-readable JSON to prose.
required_evidence:
- git diff
- changed-files list
- pytest output for tests/test_backlog.py tests/test_release.py tests/test_models.py
- assertion showing repo_state update artifact path or summary field is emitted when
  state is written
- git diff --check output
verification:
  commands:
  - /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_backlog.py
    tests/test_release.py tests/test_models.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if adding evidence paths requires incompatible changes to existing release_summary.json
  consumers.
- Stop if audit evidence cannot be generated without mutating unrelated documentation.
- Stop if deterministic ordering of update records cannot be guaranteed.
- Stop if the change overlaps with a broader CLI redesign.
non_goals:
- Do not add a new state-review agent loop.
- Do not implement fuzzy duplicate matching.
- Do not rewrite existing runtime supervisor proposal behavior.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- pgm-0002
- pgm-0004
