task_id: context-slimming-and-retrieval-0002
release_id: context-slimming-and-retrieval
title: Worker prompt context bundle integration
task_type: code_only
budget_class: M
objective: Update worker execution prompt assembly so `run-task` builds a worker-phase
  context bundle, enforces `max_context_chars_per_task` through deterministic bundle
  limits, records included and omitted source categories, writes a manifest artifact
  into task evidence, and includes the manifest path or summary in the executor prompt.
allowed_files:
- src/agentic_devloop/orchestrator.py
- src/agentic_devloop/prompt.py
- src/agentic_devloop/artifacts.py
- tests/test_orchestrator.py
- tests/test_prompt.py
forbidden_changes:
- Do not change task execution branch naming, worktree creation, verification command
  execution, or merge/finalization behavior.
- Do not increase default `max_context_chars_per_task` or bypass `enforce_context_budget`.
- Do not include broad docs/design dumps in worker prompts by default.
- Do not change feature review, repair, planning, or governor prompt behavior in this
  task.
- Do not commit generated `runs/` artifacts.
required_evidence:
- Focused pytest output for worker prompt and orchestration context tests in `tests/test_prompt.py`
  and `tests/test_orchestrator.py`.
- Assertions proving worker prompts include task contract, compact bundle content,
  and bundle manifest reference.
- Assertions proving bundle manifest artifacts are persisted under task evidence and
  include included categories, omitted categories, size metrics, and artifact path.
- Assertions proving over-budget worker context fails deterministically or truncates
  with recorded boundaries instead of silently over-injecting.
- git diff
- changed-files list
verification:
  commands:
  - /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_prompt.py
    tests/test_orchestrator.py -k 'context or prompt or bundle'
  - git diff --check
  profile: null
stop_conditions:
- Stop if worker context integration requires modifying `TaskContract` admission rules.
- Stop if evidence persistence cannot be added without changing existing task result
  schema incompatibly.
- Stop if the prompt can exceed `max_context_chars_per_task` without a deterministic
  error or truncation record.
- Stop if existing worker tests fail for unrelated worktree or verification behavior.
non_goals:
- Do not implement feature review, repair, governor, or planning bundle adoption in
  this task.
- Do not add semantic retrieval or search indexing.
- Do not update documentation in this task.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- context-slimming-and-retrieval-0001
