task_id: review-loop-convergence-policy-0002
release_id: review-loop-convergence-policy
title: Classify reviewer findings for convergence policy
task_type: code_only
budget_class: M
objective: Implement focused feature_review helpers that identify repeated findings
  by finding_id and affected file/summary similarity, distinguish blocking required
  repairs from optional adjacent quality findings, detect verification-only false-positive
  candidates after passing verification evidence, and expose a small typed result
  suitable for supervisor decision persistence.
allowed_files:
- src/agentic_devloop/feature_review.py
- tests/test_feature_review.py
forbidden_changes:
- Do not modify run_release orchestration, finalization gates, Git operations, executor
  behavior, or supervisor decision schemas.
- Do not broaden repair scope beyond source contract affected files.
- Do not treat optional follow-ups as resolved repairs; they must remain accepted
  or deferred classifications.
- Do not edit docs, repo_state, configs, objectives, contracts, generated runtime
  evidence, or lockfiles.
required_evidence:
- git diff
- pytest output for feature_review classification tests
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_feature_review.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if repeated or adjacent finding classification requires semantic model calls
  instead of deterministic helper inputs.
- Stop if classification cannot preserve required repairs as blockers by default.
- Stop if tests require release.py edits in this task.
non_goals:
- Do not persist supervisor decisions in release runs yet.
- Do not create backlog or repo-state proposal files in this task.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- review-loop-convergence-policy-0001
