task_id: rs-0005
release_id: runtime-supervisor-repair-loop
title: Add worker inspection and model escalation stops
task_type: code_only
budget_class: M
objective: Wire RuntimeSupervisor classification for long-running worker inspection
  and model escalation into task execution evidence. When task execution times out
  or exhausts supported attempts, build a supervisor input with raw log, evidence
  bundle, budget, and tuning references; emit either a bounded inspection action,
  a model escalation recommendation within configured routing, or a structured stop
  reason. Add tests for long-running worker inspection, model escalation when configured,
  and stop when escalation would exceed budget or use an unavailable model.
allowed_files:
- src/agentic_devloop/orchestrator.py
- src/agentic_devloop/executor.py
- src/agentic_devloop/runtime_supervisor.py
- tests/test_orchestrator.py
- tests/test_runtime_supervisor.py
- tests/test_config.py
forbidden_changes:
- Do not increase max executor attempts beyond configured budget.
- Do not add unbounded polling or background worker management.
- Do not bypass existing TaskRunResult evidence or ReviewDecision handling.
- Do not change release finalization, merge, or branch cleanup behavior.
- Do not require network access or live model availability in tests.
required_evidence:
- git diff
- focused orchestrator pytest output
- focused RuntimeSupervisor pytest output
- focused config pytest output when routing is touched
- changed-files list
verification:
  commands: []
  profile: code_only
stop_conditions:
- Stop if worker inspection requires killing processes outside the task-owned execution
  context.
- Stop if model escalation cannot be represented as a recommendation or bounded retry
  within existing config.
- Stop if tests need real external model calls.
- Stop if implementation would make task timeout behavior nondeterministic.
non_goals:
- Do not implement planner schema normalization.
- Do not modify documentation.
- Do not change parallel release scheduling.
- Do not add new executor backends.
scientific_assumptions:
- Not applicable; developer tooling task.
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- rs-0001
