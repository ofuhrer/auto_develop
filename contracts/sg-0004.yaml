task_id: sg-0004
release_id: agent-governed-soft-gates
title: Make normal source overlap a soft release finding
task_type: code_only
budget_class: M
objective: Extend overlap policy with configured unsafe overlap paths, classify normal
  source-file overlaps as soft findings with recommended split/rerun/repair inputs,
  preserve dependency serialization for overlapping tasks in parallel mode, and hard
  reject overlap involving unsafe paths, generated artifacts, lockfiles, migrations,
  forbidden paths, or out-of-scope paths.
allowed_files:
- src/agentic_devloop/models.py
- src/agentic_devloop/config.py
- src/agentic_devloop/release.py
- configs/auto_develop.yaml
- tests/test_config.py
- tests/test_release.py
forbidden_changes:
- Do not remove explicit depends_on enforcement.
- Do not allow parallel execution of overlapping tasks without a dependency or recorded
  soft decision.
- Do not treat generated artifacts, lockfiles, migrations, configured unsafe paths,
  forbidden paths, or out-of-scope files as soft-only risks.
- Do not change worktree cleanup or stale branch checks.
required_evidence:
- git diff
- Focused test showing normal source-file overlap is reported as a soft finding and
  serialized in the release DAG instead of hard rejected.
- Focused test showing configured unsafe overlap paths are hard rejected.
- Focused test showing exact same non-unsafe source file overlap can be accepted only
  when hard validators pass and a soft decision is recorded or the scheduler serializes
  it.
- Config validation test for the unsafe-overlap path setting.
- changed-files list
verification:
  commands:
  - PYTHONPATH=src python -m pytest tests/test_config.py tests/test_release.py
  - git diff --check
stop_conditions:
- Stop if unsafe overlap policy cannot be represented without breaking existing config
  files.
- Stop if the scheduler would run overlapping tasks concurrently without serialization
  or repair evidence.
- Stop if broad repository globs become acceptable without an explicit hard rejection
  path.
depends_on:
- sg-0001
