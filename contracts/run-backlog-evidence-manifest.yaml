task_id: run-backlog-evidence-manifest
release_id: run-backlog-autonomous-loop
title: Record run-backlog evidence artifact paths
task_type: code_only
budget_class: M
objective: >
  Extend the run-backlog workflow evidence so it records paths for backlog plan,
  generated objective, contract plan, release summary, release metrics, release
  budget, and release tuning whenever those artifacts are produced.
allowed_files:
  - src/agentic_devloop/backlog.py
  - src/agentic_devloop/models.py
  - tests/test_backlog.py
  - docs/USER_GUIDE.md
forbidden_changes:
  - Do not rename or relocate existing artifacts produced by run-objective or run-release.
  - Do not require artifacts that are optional or not produced by a specific run mode.
  - Do not commit files from runs/.
  - Do not replace existing release summary, metrics, budget, or tuning formats.
required_evidence:
  - git diff
  - test output
  - changed-files list
  - run-backlog artifact path assertions
verification:
  profile: code_only
stop_conditions:
  - Evidence path recording requires backward-incompatible persisted schema changes.
  - Required artifact paths cannot be determined deterministically from existing run results.
  - Tests would need developer-local run directories instead of temporary repositories.
depends_on:
  - run-backlog-orchestrator-chain

