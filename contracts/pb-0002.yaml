task_id: pb-0002
release_id: planner-backend-1
title: Add generated contract validation and write workflow
task_type: code_only
budget_class: M

objective: >
  Add a safe planning workflow that validates generated task contracts and can
  write proposed contract YAML files only after validation succeeds.

allowed_files:
  - src/agentic_devloop/planning*.py
  - src/agentic_devloop/yaml_io.py
  - tests/test_planning*.py

forbidden_changes:
  - Do not execute generated contracts.
  - Do not bypass Pydantic task contract validation.
  - Do not overwrite existing contract files unless explicitly requested by the user.

required_evidence:
  - git diff
  - test output
  - changed-files list
  - contract validation tests
  - executor summary
  - verifier summary

verification:
  profile: code_only

stop_conditions:
  - More than 4 files changed.
  - More than 500 diff lines.
  - Generated contract validation is ambiguous.
  - Verification fails twice.

scientific_assumptions:
  - Not applicable; developer tooling task.
