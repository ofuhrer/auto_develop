task_id: rr-slurm-log-audit-0002
release_id: rr-slurm-log-audit-1
title: Document SLURM log-audit evidence usage
task_type: documentation
budget_class: S
objective: >
  Update Balfrin SLURM driver documentation to describe the collector log-audit
  summary, how it should be reviewed, and what it does not prove. Keep wording
  scoped to conditional probe evidence.
allowed_files:
  - docs/balfrin_probe_slurm_driver.md
  - docs/tschamut_public_pilot_scaling_review.md
  - docs/mid_scale_balfrin_probe_plan.md
forbidden_changes:
  - Do not change scripts or tests.
  - Do not add operational or annual hazard claims.
  - Do not change reported metrics unless directly supported by existing evidence.
  - Do not reference non-existent manifest or run-root paths.
required_evidence:
  - git diff
  - repo consistency output
  - changed-files list
verification:
  commands:
    - python3 scripts/check_repo_consistency.py
stop_conditions:
  - More than 3 tracked files need changes.
  - More than 250 diff lines are required.
  - Documentation would need new Balfrin runtime evidence.
  - Verification fails twice.
non_goals:
  - Do not run Balfrin jobs.
  - Do not alter probe definitions.
