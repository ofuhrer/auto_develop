task_id: pgm-0002
release_id: persistent-governor-memory
title: Ingest compact release outcomes into repo state
task_type: code_only
budget_class: M
objective: Add deterministic ingestion for release_summary.json, release_metrics.json,
  release_budget.json, release_tuning.md, state_review_snapshot.json, feature_review.json,
  and feature_review_recheck.json into the durable governor memory model under the
  configured repo_state_path. Wire run-release to record compact state updates when
  repo_state_path is configured, and leave release execution successful when repo_state_path
  is absent while recording explicit evidence that no durable state path was configured.
allowed_files:
- src/agentic_devloop/state_store.py
- src/agentic_devloop/release.py
- tests/test_state_store.py
- tests/test_release.py
forbidden_changes:
- Do not parse arbitrary files from runs/ beyond the named release artifacts.
- Do not store full raw artifact contents in backlog_state.yaml; store compact summaries,
  stable IDs, decisions, counts, paths, and short rationale strings only.
- Do not change task acceptance, merge, push, or finalization behavior except to add
  deterministic state update evidence.
- Do not mutate roadmap or documentation files from release execution.
- Do not require repo_state_path for projects that currently run without one.
required_evidence:
- git diff
- changed-files list
- pytest output for tests/test_state_store.py and tests/test_release.py
- fixture or assertion showing compact release outcome data persisted under repo_state_path
- git diff --check output
verification:
  commands:
  - /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_state_store.py
    tests/test_release.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if ingestion would need to preserve complete raw logs or large markdown bodies
  in repo_state.
- Stop if release outcome status cannot be derived deterministically from release_summary.json
  and existing release result fields.
- Stop if wiring the update would silently change behavior for repositories without
  repo_state_path.
- Stop if artifact paths cannot be persisted in a stable relative-or-string form accepted
  by the existing models.
non_goals:
- Do not implement duplicate epic avoidance.
- Do not update user documentation.
- Do not add a new CLI command.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- pgm-0001
