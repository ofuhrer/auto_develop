task_id: sdr-0004
release_id: supervisor-decision-records
title: Add hard-gate enforcement tests for supervisor decisions
task_type: code_only
budget_class: M
objective: Add focused tests proving supervisor decision records cannot bypass deterministic hard gates for forbidden paths, generated artifacts, missing evidence, unsafe finalization, credentials/network policy violations, destructive operations, and unrepaired verification failures where those gates already exist.
allowed_files:
  - tests/test_supervisor_decisions.py
  - tests/test_supervisor_decision_artifacts.py
  - tests/test_release.py
  - tests/test_orchestrator.py
  - tests/test_cleanup.py
forbidden_changes:
  - Do not change production code except minimal testability hooks if a hard gate cannot otherwise be asserted.
  - Do not relax existing assertions to make tests pass.
  - Do not use the developer local Git state.
  - Do not create persistent branches, worktrees, or runtime output outside pytest temporary directories.
  - Do not delete preserved worktrees or branches.
required_evidence:
  - git diff
  - changed-files list
  - pytest output for supervisor decision and hard-gate tests
  - git diff --check output
verification:
  commands:
    - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_supervisor_decisions.py tests/test_supervisor_decision_artifacts.py tests/test_release.py tests/test_orchestrator.py tests/test_cleanup.py
    - git diff --check
  profile: null
stop_conditions:
  - Stop if a hard-gate scenario would require destructive Git operations outside a temp repo.
  - Stop if testing a listed gate requires credentials, network access, or external services.
  - Stop if production behavior must be weakened to make a decision artifact accepted.
non_goals:
  - Do not implement new hard-gate validators in this test-only task unless a minimal testability hook is unavoidable.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
  - sdr-0001
  - sdr-0002
  - sdr-0003
