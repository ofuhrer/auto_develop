task_id: pb-0001
release_id: planner-backend-1
title: Add planner backend seam and output parser
task_type: code_only
budget_class: M

objective: >
  Add a planner backend seam for strong-model planning and parse structured
  planner output into candidate task contracts without writing files yet.

allowed_files:
  - src/agentic_devloop/planning.py
  - src/agentic_devloop/models.py
  - tests/test_planning.py

forbidden_changes:
  - Do not invoke task execution from planning code.
  - Do not write generated contracts to the repository in this task.
  - Do not remove deterministic planning mode.

required_evidence:
  - git diff
  - test output
  - changed-files list
  - parser behavior tests
  - executor summary
  - verifier summary

verification:
  profile: code_only

stop_conditions:
  - More than 3 files changed.
  - More than 450 diff lines.
  - Planner output cannot be schema-validated.
  - Verification fails twice.

scientific_assumptions:
  - Not applicable; developer tooling task.
