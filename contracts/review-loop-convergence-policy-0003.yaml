task_id: review-loop-convergence-policy-0003
release_id: review-loop-convergence-policy
title: Apply convergence decisions to required finding repair loops
task_type: code_only
budget_class: L
objective: Update the release-local feature-review repair loop to persist typed classification
  decisions for required findings, generate bounded repair contracts only for blocker
  classifications, rerun configured validators after repair, perform reviewer rechecks,
  enforce explicit convergence and retry limits, and block finalization when true
  blockers remain unresolved or limits are exhausted.
allowed_files:
- src/agentic_devloop/release.py
- tests/test_release.py
forbidden_changes:
- Do not change planning, contract normalization, executor, Git finalization merge
  semantics, cleanup behavior, or runtime supervisor verification repair behavior.
- Do not allow repair contracts to include files outside mapped source contract scope.
- Do not allow unresolved required blockers to pass the finalization gate.
- Do not increase configured retry budgets silently; limits must be explicit in evidence.
- Do not edit docs, feature_review.py, supervisor_decisions.py, configs, objectives,
  contracts, generated runtime evidence, or lockfiles.
required_evidence:
- git diff
- pytest output for focused release feature-review repair-loop tests
- release evidence assertions covering classification decision artifact paths and
  convergence limit stop reasons
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_release.py -k 'feature_review and (repair or recheck or finalization
    or unresolved or convergence or repeated)'
  - git diff --check
  profile: null
stop_conditions:
- Stop if typed supervisor decisions from review-loop-convergence-policy-0001 cannot
  be persisted from the release loop without weakening validation.
- Stop if blocking in-scope findings no longer produce bounded repair contracts, verification
  reruns, reviewer rechecks, and finalization gates.
- Stop if repeated unresolved blockers can loop beyond the explicit convergence limit.
- Stop if changes require modifying executor or Git finalization modules.
non_goals:
- Do not implement non-blocking backlog/repo-state proposal behavior in this task.
- Do not document the policy in this task.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- review-loop-convergence-policy-0001
- review-loop-convergence-policy-0002
