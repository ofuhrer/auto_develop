task_id: sg-0001
release_id: agent-governed-soft-gates
title: Add typed soft-gate models and evidence serialization
task_type: code_only
budget_class: S
objective: Add typed models representing soft gate findings, severity, risk, recommended
  actions, decision outcomes, fallback plans, validators rerun, and evidence paths.
  Add evidence serialization helpers that write per-task and release-level soft-gate
  decision JSON without altering acceptance behavior.
allowed_files:
- src/agentic_devloop/models.py
- src/agentic_devloop/evidence.py
- tests/test_models.py
- tests/test_evidence.py
forbidden_changes:
- Do not change deterministic review decisions or release admission decisions in this
  task.
- Do not modify CLI arguments or user-facing command output.
- Do not change existing evidence file names or formats except by adding new optional
  soft-gate artifacts.
- Do not add dependencies.
required_evidence:
- git diff
- Tests proving the new soft-finding and soft-decision models validate required fields
  and reject unknown fields.
- Tests proving evidence helpers write stable JSON containing finding id, severity,
  risk, evidence paths, decision, rationale, fallback plan, and validators rerun.
- changed-files list
verification:
  commands:
  - PYTHONPATH=src python -m pytest tests/test_models.py tests/test_evidence.py
  - git diff --check
stop_conditions:
- Stop if the model change requires loosening StrictModel extra='forbid'.
- Stop if existing evidence tests fail for unrelated formats.
- Stop if a new dependency appears necessary.
