task_id: run-backlog-user-docs
release_id: run-backlog-autonomous-loop
title: Document run-backlog workflow and finalization relationship
task_type: documentation
budget_class: S
objective: >
  Update user-facing documentation to explain how run-backlog relates to
  plan-backlog, run-objective, generated objectives, evidence artifacts, and
  existing finalization flags.
allowed_files:
  - docs/USER_GUIDE.md
  - docs/README.md
  - README.md
forbidden_changes:
  - Do not document aspirational behavior that is not implemented.
  - Do not change architecture or roadmap documents unless implementation reveals an explicit mismatch.
  - Do not alter example configs, objectives, or contracts unless needed for a runnable documented example.
  - Do not claim run-backlog bypasses safety, budget, stale-worktree, verification, or finalization policies.
required_evidence:
  - git diff
  - test output
  - changed-files list
  - documentation examples
verification:
  profile: documentation
stop_conditions:
  - CLI contract is not implemented enough to document exact flags accurately.
  - Finalization flag behavior is ambiguous in code and needs clarification before documenting.
  - Examples would require committing generated runtime evidence.
depends_on:
  - run-backlog-cli-skeleton
