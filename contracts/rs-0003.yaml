task_id: rs-0003
release_id: runtime-supervisor-repair-loop
title: Invoke supervisor for release repair and resume
task_type: code_only
budget_class: L
objective: Modify sequential `run_release` task execution to construct RuntimeSupervisor
  inputs after supported contract-contained failures, emit repair attempt progress
  events, apply only bounded supervisor actions, and resume the failed task when the
  repair action explicitly allows release resume. Write structured repair evidence
  under the release run directory when repair is unsafe, unsupported, or exhausted.
  Keep this task scoped to release implementation only; regression tests are covered
  by the follow-up `rs-0003-tests` contract.
allowed_files:
- src/agentic_devloop/release.py
- src/agentic_devloop/runtime_supervisor.py
forbidden_changes:
- Do not change default finalization semantics or allow failed releases to merge or
  push.
- Do not bypass run_task verification, review, budget ledger, tuning report, release
  summary, or release review generation.
- Do not alter parallel scheduler behavior in this task.
- Do not change CLI flags or public JSON keys except adding structured repair evidence
  fields where release artifacts already allow additional data.
- Do not delete or hide failed task evidence.
required_evidence:
- git diff
- focused release pytest output showing existing release tests still pass
- changed-files list
verification:
  commands: []
  profile: code_only
stop_conditions:
- Stop if resuming would require skipping deterministic verification or review for
  the repaired task.
- Stop if a repair action cannot be recorded in release evidence before retrying.
- Stop if the failed task changed files outside its contract and the supervisor would
  still resume it.
- Stop if integration requires modifying parallel execution in the same task.
- Stop if retry budgeting cannot prevent repeated repair loops.
non_goals:
- Do not implement planner normalization integration.
- Do not implement long-running worker inspection integration.
- Do not add new user-facing CLI options.
- Do not document behavior in this task.
- Do not add release regression tests in this task.
scientific_assumptions:
- Not applicable; developer tooling task.
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- rs-0002
