task_id: supervisor-execution-strategy-0003
release_id: supervisor-execution-strategy
title: Gate objective planning and persist one-shot execution input
task_type: code_only
budget_class: L
objective: Update objective/planning orchestration to call the strategy selector before
  planner execution, persist the supervisor decision artifact and one-shot execution
  input when selected, skip contract generation for one-shot and replanning/stop outcomes,
  and preserve existing contract generation behavior for sequential, parallel, stacked,
  and patch-handoff strategies that require decomposition.
allowed_files:
- src/agentic_devloop/objective.py
- src/agentic_devloop/planning.py
- tests/test_objective.py
- tests/test_planning.py
forbidden_changes:
- Do not remove or bypass validate_generated_contracts for decomposition strategies.
- Do not allow one-shot strategy to write TaskContract YAML files or call the planner
  backend.
- Do not weaken deterministic hard gates for forbidden paths, generated artifacts,
  lockfiles, migrations, unsafe policy expansion, missing evidence, verification failure,
  or finalization policy.
- Do not modify backlog, governor, CLI, release execution, executor behavior, docs,
  configs, lockfiles, generated artifacts, or runtime evidence.
required_evidence:
- git diff
- pytest output for objective and planning tests
- test evidence proving one-shot skips planner backend and decomposition still writes
  validated contracts
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_objective.py tests/test_planning.py tests/test_execution_strategy.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if objective gating cannot be implemented without changing the public TaskContract
  schema or weakening contract validation.
- Stop if one-shot execution input cannot include objective, scope, non-goals, verification,
  evidence, budgets, and stop conditions in an auditable artifact.
- Stop if decomposition strategies no longer produce the same validated contract-plan
  artifacts as before.
non_goals: []
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- supervisor-execution-strategy-0002
