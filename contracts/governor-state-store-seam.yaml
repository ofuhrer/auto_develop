task_id: governor-state-store-seam
release_id: governor-service-boundaries
title: Introduce typed repo-state persistence seam
task_type: code_only
budget_class: M

objective: >
  Create `agentic_devloop.state_store` with typed state models and APIs for
  loading and saving backlog state, marking epics active, completed, or blocked,
  and recording recent run summary references. Preserve existing repo-state YAML
  compatibility where practical and cover behavior with temporary filesystem
  tests.

allowed_files:
  - src/agentic_devloop/state_store.py
  - src/agentic_devloop/models.py
  - tests/test_state_store.py

forbidden_changes:
  - Do not modify CLI command argument parsing or command output schemas.
  - Do not change plan_backlog, run_backlog, run_objective, or run_release behavior in this task.
  - Do not edit example repo-state files under repo_state/.
  - Do not introduce a database or non-filesystem persistence backend.
  - Do not depend on the developer's local Git state.

required_evidence:
  - git diff
  - focused StateStore pytest output
  - model validation pytest output if models.py changes
  - changed-files list

verification:
  profile: code_only

stop_conditions:
  - Stop if existing repo_state/*/backlog_state.yaml cannot be represented without a documented compatibility decision.
  - Stop if the implementation requires changing CLI JSON output or command-line options.
  - Stop if typed APIs would require broad rewrites outside the allowed files.
  - Stop if tests need to read or mutate real developer repo-state files instead of temporary fixtures.

non_goals:
  - Do not implement multi-epic execution.
  - Do not wire StateStore into all existing orchestration paths yet.
  - Do not implement autonomous repair or retry logic.

scientific_assumptions:
  - Not applicable; developer tooling task.

