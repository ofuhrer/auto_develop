task_id: contract-normalization-rules
release_id: governor-log-and-contract-normalization
title: Implement deterministic repair-only contract normalization rules
task_type: code_only
budget_class: M
objective: Add a deterministic normalizer that repairs only admission-safe planner
  contract drift, including missing required evidence fields, repairable schema key
  spelling or shape drift, and unsafe worktree-local .venv verification commands
  when a configured safe runtime policy exists.
allowed_files:
- src/agentic_devloop/contracts.py
- src/agentic_devloop/config.py
- src/agentic_devloop/verification.py
- tests/test_contract_normalization.py
forbidden_changes:
- Do not widen allowed_files.
- Do not remove or weaken forbidden_changes.
- Do not remove or weaken stop_conditions.
- Do not change release objective intent fields.
- Do not bypass or relax deterministic contract admission.
- Do not introduce LLM calls or heuristic broadening in the normalizer.
required_evidence:
- git diff
- changed-files list
- Tests proving missing diff and changed-file evidence can be added without changing
  task scope.
- Tests proving schema shape or spelling drift is repaired only for one-to-one mappings.
- Tests proving worktree-local .venv verification commands are rewritten only when a
  safe configured verification runtime exists.
- Tests proving unsafe normalization requests are refused with structured stop evidence.
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_contract_normalization.py
  - git diff --check
stop_conditions:
- Stop if a proposed repair could change task meaning, broaden scope, or weaken
  verification.
- Stop if runtime configuration for shared verification interpreters is not discoverable
  in existing config structures.
- Stop if deterministic admission cannot be invoked without creating circular imports.
- Stop if any test fixture would need to write outside a temporary repository.
depends_on:
- contract-normalization-models

