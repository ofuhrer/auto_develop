task_id: multi-epic-run-governor-hardening-0003
release_id: multi-epic-run-governor-hardening
title: Detect no actionable work before objective handoff
task_type: code_only
budget_class: S
objective: Add pre-objective actionable-epic detection to GovernorLoop so empty, missing,
  repeated, completed, blocked, or skipped selections produce a typed no-actionable-work
  stop with linked backlog and state-refresh artifacts.
allowed_files:
- src/agentic_devloop/governor.py
- src/agentic_devloop/backlog.py
- src/agentic_devloop/state_store.py
- tests/test_backlog.py
forbidden_changes:
- Do not change backlog planner schema requirements except as needed to consume existing
  plan fields.
- Do not delete or rewrite existing state-store memory records.
- Do not change release execution, contract planning, or task execution behavior.
- Do not silently ignore an explicit --epic-id that is absent from the backlog plan;
  keep that as a clear error unless it is intentionally classified in tests.
required_evidence:
- git diff
- pytest output for no-actionable-work and repeated-epic stop cases
- serialized multi-run result showing no_actionable_work
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_backlog.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if no-actionable-work cannot be distinguished from planner failure or planning-only
  strategy.
- Stop if the governor can still run objective planning for an epic already completed,
  blocked, skipped, or attempted in the same multi-cycle run.
- Stop if implementation requires destructive cleanup of state-store records.
- Stop if tests require edits outside the allowed files.
non_goals:
- Do not implement finalization cleanup hooks.
- Do not implement feature-review continuation handoff.
- Do not update docs in this task.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- multi-epic-run-governor-hardening-0002
