task_id: run-backlog-orchestrator-chain
release_id: run-backlog-autonomous-loop
title: Implement selected-epic backlog-to-objective orchestration
task_type: code_only
budget_class: L
objective: >
  Add the core run-backlog orchestration path that invokes the existing backlog
  planner, selects exactly one epic, writes or reuses a release objective for
  that epic, and invokes the existing run-objective flow without a routine human
  approval gate.
allowed_files:
  - src/agentic_devloop/backlog.py
  - src/agentic_devloop/objective.py
  - src/agentic_devloop/models.py
  - tests/test_backlog.py
  - tests/test_objective.py
forbidden_changes:
  - Do not weaken verification, budget, stale-worktree, branch-safety, or finalization policy checks.
  - Do not bypass run-objective or duplicate run-release behavior.
  - Do not run more than one selected epic per invocation.
  - Do not introduce hidden global state or writes outside configured objective and evidence locations.
required_evidence:
  - git diff
  - test output
  - changed-files list
  - evidence path summary
verification:
  profile: code_only
stop_conditions:
  - Backlog planner output does not expose enough stable epic identity data to select by selected_epic_id.
  - Invoking run-objective requires broad API refactoring outside the allowed files.
  - Preserving existing autonomous finalization policy is unclear from current code.
depends_on:
  - run-backlog-cli-skeleton

