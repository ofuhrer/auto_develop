task_id: run-backlog-failure-tests
release_id: run-backlog-autonomous-loop
title: Cover planner and objective failure propagation
task_type: code_only
budget_class: M
objective: >
  Add focused tests proving run-backlog fails clearly on backlog planner failure,
  invalid backlog output, and run-objective failure while preserving existing
  run-release and run-objective behavior.
allowed_files:
  - tests/test_backlog.py
  - tests/test_cli.py
  - tests/test_objective.py
  - src/agentic_devloop/backlog.py
  - src/agentic_devloop/cli.py
forbidden_changes:
  - Do not loosen existing assertions for run-release or run-objective tests.
  - Do not mock away stale worktree, budget, or verification policy checks in existing behavior tests.
  - Do not add tests that depend on network access, real agent execution, or non-temporary Git state.
  - Do not broaden exception handling to make failures appear successful.
required_evidence:
  - git diff
  - test output
  - changed-files list
  - failure propagation assertions
verification:
  profile: code_only
stop_conditions:
  - Existing test helpers cannot create a temporary project without touching local Git state.
  - Failure modes are currently indistinguishable and need an error taxonomy decision.
  - Making tests pass would require suppressing planner or run-objective failure evidence.
depends_on:
  - run-backlog-orchestrator-chain

