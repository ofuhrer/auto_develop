task_id: supervisor-execution-strategy-0002
release_id: supervisor-execution-strategy
title: Implement deterministic execution strategy selection service
task_type: code_only
budget_class: M
objective: Create a bounded execution strategy module with deterministic selection
  rules for cohesive one-shot work, sequential decomposition, parallel decomposition,
  stacked branches, patch handoff, replanning, and stop behavior for unsafe scope.
  Cover cohesive one-shot, independent parallel, coupled sequential, stacked dependency,
  patch handoff, unsafe replanning/stop, and optional evidence input recording in
  focused tests.
allowed_files:
- src/agentic_devloop/execution_strategy.py
- tests/test_execution_strategy.py
forbidden_changes:
- Do not modify existing objective, planning, backlog, CLI, release, or supervisor
  artifact wiring in this task.
- Do not make agent-judgment calls that override deterministic hard gates for forbidden
  paths, generated artifacts, lockfiles, migrations, unsafe policy expansion, missing
  evidence, verification failure, or finalization policy.
- Do not read or write runtime artifacts except via explicit paths passed into the
  strategy input model.
- Do not edit docs, configs, contracts, objectives, lockfiles, generated artifacts,
  or runtime evidence.
required_evidence:
- git diff
- pytest output for execution strategy selector tests
- selector fixture evidence showing consumed optional state/review/metrics paths
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_execution_strategy.py tests/test_supervisor_decisions.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if strategy selection needs broad repository mutation or changes outside the
  new module and focused tests.
- Stop if unsafe scope can only be handled by weakening existing deterministic hard
  gates.
- Stop if evidence-path consumption cannot be represented without stable typed fields
  on the strategy decision.
non_goals: []
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
