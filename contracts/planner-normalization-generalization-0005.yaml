task_id: planner-normalization-generalization-0005
release_id: planner-normalization-generalization
title: Document implemented planner normalization path and remaining extensions
task_type: documentation
budget_class: S
objective: Update docs and repo-state notes to describe the implemented shared typed
  normalization decision path for planner-output normalization, including decision
  artifact contents, raw artifact references, validation errors, selected action,
  fallback plan, validators rerun, normalized artifact references, refusal behavior,
  and strict hard-gate reruns. Clearly mark reviewer-output and supervisor-output
  normalization extensions as planned unless they are already implemented in code.
