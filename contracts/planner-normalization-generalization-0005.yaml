- docs/README.md
- docs/USER_GUIDE.md
- docs/DEVELOPMENT.md
- docs/design/SUPERVISOR_DECISIONS.md
- docs/design/ARCHITECTURE.md
- docs/design/ROADMAP_AND_BACKLOG.md
- repo_state/auto_develop/backlog_state.yaml
- repo_state/auto_develop/architecture_summary.md
forbidden_changes:
- Do not describe planned reviewer or supervisor normalization extensions as implemented
  unless production code and tests in this release implement them.
- Do not remove existing operational guidance for release logs, review artifacts, or
  strict supervisor decision loading.
- Do not edit source code or tests in this documentation task.
- Do not add generated runtime evidence under runs/.
required_evidence:
- git diff
- changed-files list
- Documentation review note identifying implemented behavior versus planned extensions
- git diff --check output
verification:
