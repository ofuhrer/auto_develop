task_id: afr-0004
release_id: agentic-feature-review-loop
title: Execute feature review and repair loop in release orchestration
task_type: code_only
budget_class: L
objective: Integrate feature-review, bounded repair execution, verification rerun,
  and reviewer recheck into run-release while preserving existing task/release invariants.
allowed_files:
- src/agentic_devloop/release.py
- src/agentic_devloop/feature_review.py
- tests/test_release.py
- tests/test_feature_review.py
forbidden_changes:
- Do not change run-task behavior.
- Do not merge directly to main except through existing release finalization modes.
- Do not remove stale worktree or stale branch fail-fast behavior.
- Do not weaken verification failure handling or allowed_files enforcement.
- Do not delete preserved worktrees or runtime evidence as part of repair.
required_evidence:
- git diff
- pytest output for tests/test_release.py and tests/test_feature_review.py
- release summary fixture or assertion showing feature_review_path and recheck status
- git diff --check output
- changed-files list
verification:
  commands:
  - /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_release.py
    tests/test_feature_review.py
  - git diff --check
  profile: null
stop_conditions:
- Stop if repair execution cannot reuse existing isolated worktree or task execution
  safety checks.
- Stop if reviewer recheck cannot distinguish resolved, accepted_with_rationale, blocked_by_retry_budget,
  and blocked_by_hard_gate states in persisted evidence.
- Stop if the implementation requires changing unrelated scheduler dependency semantics.
non_goals: []
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- afr-0002
- afr-0003
