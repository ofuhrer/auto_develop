task_id: sdr-0003
release_id: supervisor-decision-records
title: Migrate soft-budget acceptance to typed decisions
task_type: code_only
budget_class: L
objective: Wire the existing soft-budget acceptance judgment path to emit, persist, reload, and consume a typed supervisor decision while preserving deterministic hard-budget and safety validation.
allowed_files:
  - src/agentic_devloop/orchestrator.py
  - src/agentic_devloop/release.py
  - src/agentic_devloop/supervisor_decisions.py
  - tests/test_release.py
  - tests/test_orchestrator.py
  - tests/test_supervisor_decision_artifacts.py
  - docs/USER_GUIDE.md
forbidden_changes:
  - Do not bypass hard gates for forbidden paths, generated artifacts, missing evidence, unsafe finalization, credentials or network policy violations, destructive operations, or unrepaired verification failures.
  - Do not change default branch finalization behavior.
  - Do not modify unrelated scheduling, cleanup, or contract parsing logic.
  - Do not change public CLI arguments unless a test and documentation update are included.
  - Do not broaden file permissions in existing sample contracts.
required_evidence:
  - git diff
  - changed-files list
  - pytest output for release/orchestrator/supervisor decision artifact tests
  - CLI help output
  - compileall output
  - git diff --check output
verification:
  commands:
    - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest tests/test_release.py tests/test_orchestrator.py tests/test_supervisor_decision_artifacts.py
    - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m agentic_devloop --help
    - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m agentic_devloop run-release --help
    - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m compileall src
    - git diff --check
  profile: null
stop_conditions:
  - Stop if the chosen soft-budget path cannot be located or is not covered by focused tests.
  - Stop if consuming the decision would require weakening any existing hard validation.
  - Stop if the implementation starts touching multiple unrelated decision paths.
non_goals:
  - Do not migrate release scheduling, review-loop continuation, or environment repair in this task.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
