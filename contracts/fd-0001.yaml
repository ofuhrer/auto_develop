task_id: fd-0001
release_id: failure-diagnosis-1
title: Add structured failure diagnosis models and evidence files
task_type: code_only
budget_class: M

objective: >
  Define the structured data needed for repeated-failure diagnosis and persist
  it as evidence. Include diagnosis inputs, category, confidence, supporting
  evidence excerpts, recommendation, retryable/escalate guidance, and source
  metadata while preserving the existing failure_diagnosis.yaml behavior.

allowed_files:
  - src/agentic_devloop/models.py
  - src/agentic_devloop/evidence.py
  - tests/test_models.py
  - tests/test_evidence.py

forbidden_changes:
  - Do not change executor execution behavior.
  - Do not change verification behavior.
  - Do not change CLI arguments.
  - Do not remove or rename existing evidence files without backward-compatible aliases.

required_evidence:
  - git diff
  - test output
  - changed-files list
  - model/schema validation tests
  - evidence writer tests

verification:
  profile: code_only

stop_conditions:
  - More than 4 files changed.
  - More than 450 diff lines.
  - Existing evidence bundle tests fail.
  - The task requires orchestrator behavior changes.

scientific_assumptions:
  - Not applicable; developer tooling task.
