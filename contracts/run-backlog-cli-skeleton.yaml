task_id: run-backlog-cli-skeleton
release_id: run-backlog-autonomous-loop
title: Add run-backlog CLI entrypoint and option plumbing
task_type: code_only
budget_class: M
objective: >
  Introduce a bounded run-backlog CLI command that accepts a configured project
  and one selected backlog epic identifier, validates inputs, and delegates
  execution to an orchestrator function without implementing workflow logic in
  the CLI layer.
allowed_files:
  - src/agentic_devloop/cli.py
  - tests/test_cli.py
  - docs/USER_GUIDE.md
forbidden_changes:
  - Do not change existing run-release or run-objective argument semantics.
  - Do not alter cleanup, plan-backlog, run-task, or status behavior.
  - Do not implement backlog planner parsing or release execution logic in cli.py beyond argument validation and delegation.
  - Do not modify generated runtime evidence under runs/.
required_evidence:
  - git diff
  - test output
  - CLI help output
  - changed-files list
verification:
  profile: code_only
stop_conditions:
  - Existing CLI framework cannot support adding a subcommand without broad refactoring.
  - Required option names conflict with existing commands in a way that would change their behavior.
  - Tests require real external agents or non-temporary repositories.

