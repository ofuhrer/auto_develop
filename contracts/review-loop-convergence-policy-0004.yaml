task_id: review-loop-convergence-policy-0004
release_id: review-loop-convergence-policy
title: Accept or defer non-blocking reviewer findings with evidence
task_type: code_only
budget_class: L
objective: Extend release feature-review handling so duplicate, false-positive, already-proven-by-verification,
  and accepted soft findings are accepted only through typed classification decisions
  with rationale, evidence paths, fallback_plan, and validators_to_rerun; record scope-expansion
  and backlog-follow-up classifications as release summary/recheck proposal entries
  rather than generating repair contracts; add focused tests for adjacent findings
  after repair and false positives after passing verification.
allowed_files:
- src/agentic_devloop/release.py
- tests/test_release.py
forbidden_changes:
- Do not modify supervisor decision schemas, feature_review classification helpers,
  planning, executor, Git finalization merge behavior, or cleanup behavior.
- Do not create or edit tracked backlog_state.yaml or design docs in this task; record
  proposals in release-run evidence only.
- Do not accept non-blocking findings without persisted typed decisions, rationale,
  evidence paths, fallback plan, and validators_to_rerun.
- Do not convert scope-expansion or backlog-follow-up findings into repair contracts
  for the current release loop.
- Do not edit configs, objectives, contracts, generated runtime evidence, or lockfiles.
required_evidence:
- git diff
- pytest output for focused release tests covering duplicate, false-positive, soft-finding,
  scope-expansion, and backlog-follow-up handling
- release summary or recheck artifact assertions showing deferred proposal records
verification:
  commands:
  - PYTHONPATH=src /Users/fuhrer/Desktop/auto_develop/main/.venv/bin/python -m pytest
    tests/test_release.py -k 'feature_review and (optional or false_positive or duplicate
    or scope or backlog or adjacent or accepted)'
  - git diff --check
  profile: null
stop_conditions:
- Stop if any accepted non-blocking classification can be persisted without rationale,
  evidence paths, fallback plan, and validators_to_rerun.
- Stop if scope-expansion or backlog-follow-up findings extend the current repair
  loop instead of being recorded as proposals.
- Stop if finalization gate ignores unresolved true blockers while accepting non-blocking
  findings.
- Stop if implementation requires modifying tracked repo_state files in this task.
non_goals:
- Do not update user documentation or repo-state notes in this task.
- Do not implement the broader N-epic governor loop.
scientific_assumptions: []
fixture_changes_allowed: false
tolerance_changes_allowed: false
benchmark_delta_required: false
remote_dispatch: null
depends_on:
- review-loop-convergence-policy-0003
