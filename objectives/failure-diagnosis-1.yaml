release_id: failure-diagnosis-1
title: Model-assisted repeated-failure diagnosis
objective: >
  Add a bounded failure-diagnosis workflow that turns repeated executor or
  verification failures into structured, auditable diagnosis evidence. The
  workflow should keep deterministic classification as the baseline, add a
  replaceable model-backed diagnosis seam for stronger review, and wire the
  diagnosis into task evidence without allowing unbounded retry loops.
non_goals:
  - Do not add a database, web UI, or external service dependency.
  - Do not weaken deterministic review or verification requirements.
  - Do not automatically retry beyond configured task attempt budgets.
  - Do not implement PR automation or Balfrin/SLURM execution in this release.
acceptance_criteria:
  - Executor and verification failures can produce a structured diagnosis
    artifact with category, confidence, evidence excerpts, recommendation, and
    retry/escalation guidance.
  - The diagnosis path has a deterministic fallback and an injectable
    model-backed backend seam that can be tested without real model calls.
  - Repeated failed executor attempts and failed verification commands are
    summarized from existing evidence, not from agent self-report alone.
  - Task evidence records diagnosis inputs and outputs in stable files.
  - Existing release and task workflows remain backward compatible.
  - The full pytest suite passes.
