release_id: rr-slurm-log-audit-1
title: Add SLURM collector log-audit summary
objective: >
  Extend the rust_rockfall Balfrin SLURM collector so local collection summaries
  include a lightweight warning/error scan of generated SLURM logs, then document
  how that evidence should be used when reviewing fresh and repeat/reuse probe runs.
non_goals:
  - Do not submit SLURM jobs.
  - Do not change simulation physics, probability semantics, validation fixtures, or numerical tolerances.
  - Do not change tracked probe definitions or runtime output roots.
  - Do not claim operational or annual hazard-map readiness.
acceptance_criteria:
  - Collector summary includes a deterministic log warning/error scan for run-root logs when present.
  - Collector remains robust when logs are missing.
  - Focused Balfrin driver tests pass.
  - Repository consistency check passes.
  - Documentation explains how to interpret log-audit evidence and its limitations.
