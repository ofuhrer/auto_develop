release_id: release-governor-1
title: Budget-aware release governance and diagnostics
objective: >
  Add a pragmatic release-governor layer that turns recent closed-loop run
  learnings into preflight diagnostics, budget accounting, budget enforcement,
  and post-run tuning guidance. The goal is to make larger autonomous releases
  safer by catching bad project setup before execution, recording actionable
  cost and task-size metrics, enforcing configured budget limits, and producing
  recommendations for model routing and task sizing after a run.
non_goals:
  - Do not add a database, web UI, or external service dependency.
  - Do not implement provider-billed token accounting; use local character and
    attempt metrics until executor usage metadata is available.
  - Do not implement PR automation.
  - Do not add Balfrin or remote execution.
  - Do not weaken deterministic verification or review gates.
acceptance_criteria:
  - "`agent-loop doctor --project <project>` reports project, Git, worktree,
    verification, and model-routing preflight diagnostics."
  - Release runs write budget and tuning artifacts that summarize configured
    budgets, actual usage, model attempts, context size, prompt/output size,
    verification time, changed files, and diff size.
  - Release runs deterministically enforce configured release-level budget
    limits before successful acceptance.
  - Post-run tuning guidance flags unsupported or wasteful model attempts,
    oversized tasks, context-heavy tasks, and verification bottlenecks using
    recorded evidence rather than agent self-report.
  - Documentation explains how to run diagnostics and use metrics to tune
    models, context, and task sizes.
  - The full pytest suite passes.
