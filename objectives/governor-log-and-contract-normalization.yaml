release_id: governor-log-and-contract-normalization
title: Add top-level governor logging and autonomous planner-output normalization
objective: Implement a bounded autonomous normalization path for semantically useful
  planner-generated contracts that fail deterministic admission for repairable reasons,
  and add a parent governor run log/event stream that links backlog planning, objective
  generation, contract planning, normalization, release execution, repair, finalization,
  and state refresh artifacts.
non_goals:
- Do not execute implementation workers while planning the backlog.
- Do not broaden the selected epic beyond its acceptance criteria.
acceptance_criteria:
- Planner-generated contracts that only miss required evidence such as git diff or
  changed-files list are normalized without changing task meaning, then rerun through
  deterministic contract admission.
- Planner-generated verification commands that assume a worktree-local .venv are normalized
  to the configured project verification runtime or rejected with structured stop
  evidence if no safe runtime policy exists.
- Schema shape or spelling drift that can be repaired without broadening scope is
  normalized with an auditable rationale and before/after evidence.
- Normalization must not widen allowed_files, remove forbidden_changes, weaken stop_conditions,
  change release objective intent, or bypass deterministic validation.
- A top-level governor run directory records governor.log, governor.raw.log, and events.jsonl
  for backlog planning, objective writing or reuse, contract planning, normalization
  attempts, release execution, repair/resume actions, finalization, and repo-state
  update proposals.
- The governor log links child artifact paths including backlog plan, objective, contract
  plan, release log, release summary, metrics, budget, tuning report, and evidence
  manifest.
- Focused tests cover successful normalization, hard-stop normalization refusal, event/log
  emission, and artifact linking.
