release_id: supervisor-decision-records
title: Add typed supervisor decision records
objective: Introduce typed, auditable supervisor decision artifacts for scheduling,
  repair-loop continuation, review-finding adjudication, soft-budget acceptance, contract
  normalization, and environment repair so deterministic code can emit facts and enforce
  hard validators while supervisor agents own judgment-heavy decisions.
non_goals:
- Do not broaden the selected epic beyond its stated acceptance criteria.
acceptance_criteria:
- Define versioned supervisor decision schemas/models covering scheduling, repair-loop
  continuation, review-finding adjudication, soft-budget acceptance, contract normalization,
  and environment repair.
- Persist decision artifacts with evidence paths, rationale, selected action, fallback
  plan, validators to rerun, and hard-gate status.
- Wire at least one existing procedural judgment path to emit and consume a typed
  supervisor decision without weakening deterministic validation.
- Keep hard gates non-bypassable for forbidden paths, generated artifacts, missing
  evidence, unsafe finalization, credentials/network policy violations, destructive
  operations, and unrepaired verification failures.
- Update roadmap, repo-state memory, and user/development docs to distinguish implemented
  typed decision records from still-planned N-epic governor behavior.
- Add focused tests for schema validation, artifact persistence, hard-gate enforcement,
  and the first migrated decision path.
