release_id: governor-state-review
title: Pre-epic repository state review
objective: Add a governor state-review pass that captures current repository evidence
  before backlog prioritization, including source and branch status, docs drift, repo-state
  memory, recent runs, metrics, release reviews, unresolved findings, and artifact
  summaries.
non_goals:
- Do not broaden the selected epic beyond its stated acceptance criteria.
acceptance_criteria:
- A state-review snapshot artifact is produced before backlog epic selection and is
  linked from governor or backlog planning evidence.
- The snapshot includes branch status, dirty-state summary, relevant open feature/agent
  branches, source/docs layout signals, repo-state memory summaries, recent run summaries,
  release metrics, budget/tuning artifacts, release reviews, and unresolved findings
  when present.
- Backlog planning receives the state-review snapshot as bounded context and can cite
  it in selected-epic rationale or warnings.
- The implementation preserves deterministic hard gates and does not add routine human
  approval gates.
- Docs and repo-state memory are updated to distinguish implemented state-review behavior
  from still-planned feature review, persistent memory, and N-epic looping.
- Focused tests cover snapshot collection, missing-artifact tolerance, planner context
  inclusion, and artifact path recording.
