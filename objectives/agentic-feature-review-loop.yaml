release_id: agentic-feature-review-loop
title: Independent feature-review and repair loop
objective: Add an independent reviewer-agent pass over integrated feature branches
  that emits structured findings, turns required findings into bounded repair contracts,
  reruns verification, and re-checks review status before PR, merge, or autonomous
  finalization.
non_goals:
- Do not broaden the selected epic beyond its stated acceptance criteria.
acceptance_criteria:
- A reviewer role can inspect the integrated feature branch diff against the configured
  base branch plus relevant contracts, verification evidence, soft-gate decisions,
  release metrics, and architecture constraints.
- Feature-review output is persisted as structured evidence with reviewer decision,
  findings, severity, required/optional status, affected files, rationale, and suggested
  repair scope.
- Required reviewer findings can be converted into bounded repair contracts that preserve
  allowed-file and forbidden-change policy.
- Repair contracts execute through existing task/release machinery or a narrow repair
  path, then rerun required verification.
- Reviewer re-check runs after repair and records whether findings are resolved, accepted
  with rationale, or blocked by retry budget or hard gates.
- Release finalization is gated so PR creation, merge-main, push-main, or policy-approved
  autonomous finalization cannot proceed while unresolved required findings remain.
- Documentation and repo-state notes distinguish the implemented feature-review loop
  from still-planned persistent memory and N-epic governor behavior.
