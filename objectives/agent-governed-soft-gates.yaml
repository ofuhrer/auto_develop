release_id: agent-governed-soft-gates
title: Agent-Governed Soft Gate Decisions
objective: Add a typed soft-gate decision layer so deterministic review and release
  admission emit structured soft findings, then a reviewer or runtime-supervisor decision
  chooses accept, split, rerun, repair, or escalate without bypassing hard invariants.
non_goals:
- Do not execute implementation workers while planning the backlog.
- Do not broaden the selected epic beyond its acceptance criteria.
acceptance_criteria:
- Deterministic review and release admission distinguish hard invariant violations
  from soft findings with severity, risk, evidence paths, and recommended action inputs.
- A reviewer/supervisor decision artifact records finding, risk assessment, decision,
  rationale, fallback plan, and validators rerun for every accepted soft exception.
- Small budget overages and normal source-file overlap no longer cause unconditional
  hard rejection when hard validators pass and a typed soft decision accepts or repairs
  them.
- Hard gates remain non-bypassable for forbidden paths, generated artifacts, missing
  required evidence, unsafe finalization, credentials or network policy violations,
  destructive operations, and unrepaired verification failures.
- Focused tests cover accepted soft budget overage, rejected severe budget overage,
  overlap handled as a soft finding for normal source files, and hard rejection for
  configured unsafe overlap paths.
- User and design documentation describe implemented soft-gate behavior without claiming
  the full N-epic governor loop is shipped.
